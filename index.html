<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>stotco sheets</title>
<style>
  /* Geteilte Setliste (?s=): nur ansehen und transponieren */
  body.nur-lesen #btn-export, body.nur-lesen #btn-import, body.nur-lesen #btn-einstellungen,
  body.nur-lesen .griff, body.nur-lesen .sec-ops, body.nur-lesen .sl-hinzu,
  body.nur-lesen .nur-lokal { display: none !important; }
  body.nur-lesen .sl-kopf input { pointer-events: none; border-color: transparent; background: transparent; }
  .teilen-panel { margin: 0.6rem 0 1rem; }
  .teilen-panel input { width: 100%; font: 0.8rem monospace; margin-top: 0.4rem; }
  :root {
    --paper: #f6f3ea;
    --card: #fdfcf7;
    --ink: #17140f;
    --muted: #7c7469;
    --line: #cfc7b6;
    --barline: #3a352c;
    --accent: #a33327; /* Real-Book-Rot */
    --c-strophe: #3d6b9e;
    --c-refrain: #a33327;
    --c-bridge: #4a7c46;
    --c-intro: #6b6459;
    --c-solo: #7a4f8f;
    --c-zwischenspiel: #3f7f7a;
    --c-vorrefrain: #b0722a;
    --font-chart: 'Avenir Next Condensed', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-body: 'Charter', 'Iowan Old Style', Palatino, Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
  }
  header.chrome {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.6rem 1.2rem;
    border-bottom: 2px solid var(--ink);
  }
  header.chrome h1 {
    font-family: var(--font-chart);
    font-size: 1.25rem;
    font-weight: 700;
    letter-spacing: 0.02em;
    text-transform: lowercase;
  }
  header.chrome h1 .accent { color: var(--accent); }
  header.chrome .spacer { flex: 1; }
  button {
    font-family: var(--font-chart);
    font-size: 0.92rem;
    padding: 0.3rem 0.8rem;
    border: 1px solid var(--barline);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { padding: 1.2rem clamp(1rem, 4vw, 3rem); max-width: 1180px; margin: 0 auto; }
  #export-reminder {
    display: none;
    background: #f6e7d6;
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 0.4rem 0.8rem;
    margin-bottom: 1rem;
    font-size: 0.9rem;
  }
  #export-reminder.visible { display: block; }

  /* ---------- Bibliothek ---------- */
  .lib-suche {
    width: 100%;
    font: inherit;
    font-size: 1rem;
    padding: 0.5rem 0.8rem;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card);
    margin: 0.8rem 0 1.2rem;
  }
  .lib-item {
    display: flex;
    align-items: baseline;
    gap: 0.8rem;
    width: 100%;
    text-align: left;
    padding: 0.7rem 1rem;
    margin-bottom: 0.5rem;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
  }
  .lib-item:hover { border-color: var(--accent); }
  .lib-item .t { font-family: var(--font-chart); font-weight: 700; font-size: 1.1rem; }
  .lib-item .a { color: var(--muted); }
  .lib-item .k {
    margin-left: auto;
    font-family: var(--font-chart);
    font-weight: 700;
    color: var(--accent);
  }
  .lib-leer { color: var(--muted); font-style: italic; padding: 2rem 0; }
  .lib-item .loeschen {
    margin-left: 0.8rem; padding: 0.1rem 0.5rem; font-size: 0.85rem;
    color: var(--muted); border-color: var(--line);
  }
  .lib-item .loeschen:hover, .lib-item .loeschen.bestaetigen {
    color: #fff; background: var(--accent); border-color: var(--accent);
  }

  /* ---------- Songansicht: Chart-Kopf ---------- */
  .sheet-head {
    display: flex;
    align-items: flex-end;
    gap: 1.2rem;
    border-bottom: 3px double var(--ink);
    padding-bottom: 0.6rem;
    margin-bottom: 1.4rem;
  }
  .sheet-head .titel {
    font-family: var(--font-chart);
    font-weight: 700;
    font-size: 2.1rem;
    line-height: 1.05;
  }
  .sheet-head .kuenstler { color: var(--muted); font-style: italic; }
  .sheet-head .meta {
    margin-left: auto;
    display: flex;
    gap: 1.2rem;
    font-family: var(--font-chart);
    font-weight: 600;
    white-space: nowrap;
  }
  .sheet-head .meta .label {
    display: block;
    font-size: 0.68rem;
    font-weight: 400;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .sheet-notizen { color: var(--muted); font-size: 0.92rem; margin: -0.8rem 0 1.2rem; font-style: italic; }

  /* ---------- Zwei Spalten mit ziehbarer Trennlinie ---------- */
  .sheet-body {
    display: grid;
    grid-template-columns: minmax(0, calc(var(--split, 55) * 1%)) 18px minmax(0, 1fr);
    gap: 0 0.6rem;
    align-items: start;
  }
  .split-divider {
    align-self: stretch;
    cursor: col-resize;
    position: relative;
    touch-action: none;
  }
  .split-divider::before {
    content: '';
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 1px;
    background: var(--line);
  }
  .split-divider:hover::before, .split-divider.zieht::before {
    width: 3px; margin-left: -1px;
    background: var(--accent);
  }
  body.stage-mode .split-divider::before { background: #3a352c; }
  @media (max-width: 760px) {
    .sheet-body { grid-template-columns: 1fr; }
    .split-divider { display: none; }
  }

  /* Abschnittsmarke (rehearsal mark) — die Farbkopplung beider Spalten */
  .sec-mark {
    display: inline-block;
    font-family: var(--font-chart);
    font-weight: 700;
    font-size: 0.82rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #fff;
    background: var(--sec, var(--c-intro));
    padding: 0.12em 0.55em;
    border-radius: 2px;
  }

  .lyr-sec { margin-bottom: 1.3rem; }
  .lyr-sec .zeilen {
    margin-top: 0.35rem;
    line-height: 1.55;
    font-size: 1.04rem;
    white-space: pre-line;
  }
  .lyr-sec .zeilen:empty::after { content: '(instrumental)'; color: var(--muted); font-style: italic; }

  .grid-sec { margin-bottom: 1.5rem; }
  .grid-sec .grid-head {
    display: flex;
    align-items: baseline;
    gap: 0.6rem;
    margin-bottom: 0.35rem;
  }
  .grid-sec .taktart {
    font-family: var(--font-chart);
    font-weight: 600;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .bars {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    border: 2px solid var(--sec, var(--barline));
    background: var(--card);
  }
  .bar {
    min-height: 2.6rem;
    display: flex;
    align-items: center;
    padding: 0.25rem 0.4rem;
  }
  .bar:not(:nth-child(4n+1)) { border-left: 1px solid var(--barline); }
  .bar:nth-child(n+5) { border-top: 1px solid var(--barline); }
  .bar .ch {
    flex: 1;
    font-family: var(--font-chart);
    font-weight: 700;
    font-size: 1.35rem;
    letter-spacing: 0.01em;
  }
  .bar .ch sup { font-size: 0.62em; }
  .bar .rep { color: var(--muted); text-align: center; }
  .bar .nc { color: var(--muted); font-size: 1.05rem; }
  /* Verdichtete Ansicht: ein Raster pro Segment, Wiederholung mit Badge "n×" */
  .bars-segmente { display: flex; flex-direction: column; gap: 0.35rem; }
  .bars.wdh { position: relative; margin-top: 0.55rem; }
  .wdh-badge {
    position: absolute; top: -0.7rem; right: 0.5rem;
    font-family: var(--font-chart); font-weight: 700; font-size: 0.85rem; line-height: 1.25;
    padding: 0 0.5rem; border-radius: 2px;
    background: var(--sec, var(--barline)); color: #fff;
  }
  .ansicht-wahl { display: inline-flex; }
  .ansicht-wahl button:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
  .ansicht-wahl button:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }

  .zurueck { margin-bottom: 1rem; }

  /* ---------- UG-Import ---------- */
  .import-feld {
    width: 100%; min-height: 18rem; font-family: ui-monospace, Menlo, monospace;
    font-size: 0.85rem; line-height: 1.45; padding: 0.8rem;
    border: 1px solid var(--line); border-radius: 3px; background: var(--card);
    margin: 0.8rem 0; resize: vertical; white-space: pre;
  }
  .badge-warn {
    display: inline-block; font-family: var(--font-chart); font-size: 0.78rem;
    font-weight: 600; color: #7a4f10; background: #f6e7c6;
    border: 1px solid #d9b96a; border-radius: 2px; padding: 0.15em 0.55em;
  }
  .import-hinweis { color: var(--muted); font-size: 0.92rem; }
  .ireal-fund { display: flex; gap: 0.5rem; align-items: center; padding: 0.25rem 0; border-bottom: 1px solid var(--line); }
  .ireal-fund span:first-of-type { flex: 1; }
  .import-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem;
    align-items: start; margin-top: 0.8rem;
  }
  @media (max-width: 900px) { .import-grid { grid-template-columns: 1fr; } }
  .import-grid .import-feld { margin: 0; min-height: 24rem; }
  .import-vorschau {
    max-height: 32rem; overflow: auto;
    border: 1px dashed var(--line); border-radius: 3px;
    padding: 0.8rem; background: var(--paper);
  }
  .import-vorschau .v-titel { font-family: var(--font-chart); font-weight: 700; font-size: 1.15rem; }
  .import-vorschau .v-meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 0.8rem; }
  .import-vorschau .bar { min-height: 1.9rem; }
  .import-vorschau .bar .ch { font-size: 1.05rem; }
  .import-vorschau .grid-sec { margin-bottom: 1rem; }
  .import-vorschau .v-leer { color: var(--muted); font-style: italic; }
  .import-opts { display: flex; align-items: center; gap: 0.4rem; margin: 0.6rem 0; font-size: 0.92rem; }

  /* ---------- Einstellungen ---------- */
  .einst-gruppe {
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
    padding: 1rem 1.2rem; margin-bottom: 1rem; max-width: 36rem;
  }
  .einst-gruppe h3 {
    font-family: var(--font-chart); font-size: 0.72rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
    margin-bottom: 0.6rem;
  }
  .einst-gruppe label.radio {
    display: flex; align-items: center; gap: 0.5rem; padding: 0.25rem 0;
    cursor: pointer;
  }
  .einst-gruppe .hinweis { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
  .einst-zoom { display: inline-flex; align-items: center; gap: 0.6rem; }
  .einst-zoom .wert { font-family: var(--font-chart); font-weight: 700; min-width: 3.5rem; text-align: center; }
  .ug-suche {
    flex: 1; font: inherit; font-size: 0.95rem; padding: 0.35rem 0.6rem;
    border: 1px solid var(--line); border-radius: 3px; background: var(--card);
  }
  .ug-quelle {
    font-family: ui-monospace, Menlo, monospace; font-size: 0.8rem; line-height: 1.4;
    background: var(--card); border: 1px dashed var(--line); border-radius: 3px;
    padding: 0.8rem; margin-bottom: 1.2rem; max-height: 18rem; overflow: auto;
  }

  /* ---------- Bühnenmodus: dunkel, groß, blendfrei ---------- */
  body.stage-mode { background: #12100c; color: #f0ebdd; }
  body.stage-mode header.chrome, body.stage-mode #export-reminder { display: none; }
  body.stage-mode main { max-width: none; padding: 0.5rem 1.2rem 40vh; }
  .stage-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; gap: 0.6rem;
    padding: 0.4rem 0.8rem;
    background: rgba(18, 16, 12, 0.92);
    border-bottom: 1px solid #3a352c;
  }
  .stage-bar .titel-klein {
    font-family: var(--font-chart); font-weight: 700; font-size: 1rem; color: #f0ebdd;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .stage-bar .spacer { flex: 1; }
  .stage-bar button {
    background: transparent; color: #f0ebdd; border-color: #4a443a;
  }
  .stage-bar button:hover { border-color: var(--accent); color: #fff; }
  .stage-inhalt { padding-top: 3.2rem; zoom: var(--stage-zoom, 1.25); }
  body.stage-mode .sheet-head { border-color: #f0ebdd; }
  body.stage-mode .sheet-head .titel { color: #fff; }
  body.stage-mode .sheet-head .kuenstler, body.stage-mode .sheet-head .meta .label,
  body.stage-mode .sheet-notizen, body.stage-mode .grid-sec .taktart { color: #9a917f; }
  body.stage-mode .bars { background: #1c1913; border-width: 2px; }
  body.stage-mode .bar:not(:nth-child(4n+1)) { border-left-color: #57503f; }
  body.stage-mode .bar:nth-child(n+5) { border-top-color: #57503f; }
  body.stage-mode .bar .ch { color: #ffffff; }
  body.stage-mode .bar .rep, body.stage-mode .bar .nc { color: #9a917f; }
  body.stage-mode .wdh-badge { font-size: 1.1rem; }
  body.stage-mode .lyr-sec .zeilen { color: #e6dfcf; }
  .tap-zone {
    position: fixed; top: 3.2rem; bottom: 0; width: 34%; z-index: 5;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .tap-zone.links { left: 0; }
  .tap-zone.rechts { right: 0; }
  /* Bühnen-Ansichten: nur Text / nur Raster → einspaltig, Trennlinie weg */
  .stage-inhalt .sheet-body.einspaltig { grid-template-columns: 1fr; }
  .stage-inhalt .sheet-body.einspaltig .split-divider { display: none; }
  .stage-inhalt .sheet-body.einspaltig .lyrics-col { max-width: 44rem; margin: 0 auto; }

  /* ---------- Transposition ---------- */
  .transpose-ctl { display: inline-flex; align-items: center; gap: 0.35rem; margin-left: 0.6rem; }
  .transpose-ctl .t-key {
    font-family: var(--font-chart); font-weight: 700; font-size: 1.05rem;
    min-width: 2.6rem; text-align: center;
  }
  .transpose-ctl select {
    font-family: var(--font-chart); font-size: 0.85rem; padding: 0.2rem 0.3rem;
    border: 1px solid var(--line); border-radius: 2px; background: var(--card);
  }
  .t-orig { color: var(--muted); font-size: 0.85rem; font-style: italic; }

  /* ---------- Editor ---------- */
  .song-toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; flex-wrap: wrap; }
  .song-toolbar .primaer { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .song-toolbar .primaer:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .song-toolbar.drop-aktiv { outline: 2px dashed var(--accent); outline-offset: 4px; border-radius: 4px; }
  .pdf-status { font-family: var(--font-chart); font-size: 0.8rem; color: var(--muted); }

  .head-edit { display: grid; grid-template-columns: repeat(6, auto); gap: 0.6rem; margin-bottom: 1.2rem; align-items: end; }
  .head-edit label { font-family: var(--font-chart); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); display: block; }
  .head-edit input {
    font: inherit; padding: 0.3rem 0.5rem; border: 1px solid var(--line);
    border-radius: 3px; background: var(--card); width: 100%;
  }
  .head-edit .feld-titel { grid-column: span 2; }
  .head-edit .feld-notizen { grid-column: span 6; }
  @media (max-width: 760px) { .head-edit { grid-template-columns: repeat(2, 1fr); } .head-edit .feld-titel, .head-edit .feld-notizen { grid-column: span 2; } }

  .bar.editierbar { cursor: pointer; }
  .bar.editierbar:hover { background: #efe9da; }
  .bar.aktiv { outline: 2px solid var(--accent); outline-offset: -2px; }
  .bar input {
    width: 100%; border: none; background: transparent;
    font-family: var(--font-chart); font-weight: 700; font-size: 1.35rem;
    outline: none; padding: 0;
  }
  .bar input.fehler { color: var(--accent); text-decoration: underline wavy var(--accent); }

  .takt-ops, .suffix-chips { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.35rem; }
  .takt-ops button, .suffix-chips button, .sec-ops button {
    font-size: 0.78rem; padding: 0.15rem 0.5rem; border-radius: 2px;
  }
  .suffix-chips button { font-family: var(--font-chart); font-weight: 700; }
  .sec-ops { display: inline-flex; gap: 0.3rem; margin-left: 0.5rem; }
  .sec-rename, .sec-taktart {
    font-family: var(--font-chart); font-weight: 700; font-size: 0.85rem;
    padding: 0.1rem 0.4rem; border: 1px solid var(--line); border-radius: 2px; background: var(--card);
  }
  .sec-rename { width: 9rem; }
  .sec-taktart { width: 3.2rem; }

  .lyr-edit textarea {
    width: 100%; min-height: 5.5rem; font: inherit; font-size: 1rem; line-height: 1.5;
    padding: 0.5rem; border: 1px solid var(--line); border-radius: 3px; background: var(--card);
    margin-top: 0.35rem; resize: vertical;
  }
  .lyr-edit select {
    font-family: var(--font-chart); font-size: 0.85rem; padding: 0.15rem 0.3rem;
    border: 1px solid var(--line); border-radius: 2px; background: var(--card);
  }
  .block-hinzu { margin-top: 0.2rem; }

  /* ---------- Setlisten ---------- */
  .tab-schalter { display: inline-flex; border: 1px solid var(--barline); border-radius: 3px; overflow: hidden; }
  .tab-schalter button { border: none; border-radius: 0; }
  .tab-schalter button.aktiv { background: var(--ink); color: var(--paper); }
  .sl-kopf { display: flex; gap: 0.8rem; align-items: baseline; margin: 0.4rem 0 1rem; flex-wrap: wrap; }
  .sl-kopf input[type="text"] {
    font-family: var(--font-chart); font-weight: 700; font-size: 1.4rem;
    border: 1px solid transparent; border-radius: 3px; background: transparent;
    padding: 0.1rem 0.3rem; min-width: 14rem;
  }
  .sl-kopf input:hover, .sl-kopf input:focus { border-color: var(--line); background: var(--card); }
  .sl-kopf input[type="date"] {
    font: inherit; border: 1px solid var(--line); border-radius: 3px;
    background: var(--card); padding: 0.2rem 0.4rem;
  }
  .sl-eintrag {
    display: flex; align-items: center; gap: 0.7rem;
    padding: 0.5rem 0.8rem; margin-bottom: 0.4rem;
    background: var(--card); border: 1px solid var(--line); border-radius: 3px;
  }
  .sl-eintrag.drag-ueber { border-top: 3px solid var(--accent); }
  .sl-eintrag .griff { cursor: grab; color: var(--muted); font-size: 1.1rem; }
  .sl-eintrag .nr { font-family: var(--font-chart); font-weight: 700; color: var(--muted); min-width: 1.4rem; text-align: right; }
  .sl-eintrag .titel-link {
    font-family: var(--font-chart); font-weight: 700; font-size: 1.05rem;
    background: none; border: none; padding: 0; cursor: pointer; color: var(--ink); text-align: left;
  }
  .sl-eintrag .titel-link:hover { color: var(--accent); }
  .sl-eintrag .kuenstler { color: var(--muted); font-size: 0.9rem; }
  .sl-eintrag .spacer { flex: 1; }
  .sl-eintrag .override-hinweis { font-size: 0.78rem; color: var(--muted); font-style: italic; }
  .sl-hinzu { display: flex; gap: 0.5rem; margin-top: 0.8rem; align-items: center; }
  .sl-hinzu select { font: inherit; padding: 0.3rem 0.5rem; border: 1px solid var(--line); border-radius: 3px; background: var(--card); flex: 1; max-width: 24rem; }
  .ireal-export { margin: 0.8rem 0; padding: 0.6rem 0.8rem; border: 1px solid var(--line); border-radius: 3px; background: var(--card); }
  .sl-leer { color: var(--muted); font-style: italic; padding: 1.2rem 0; }

  /* Setlisten-Komplettdruck: Deckblatt + ein Song pro Seite */
  .print-deckblatt h2 { font-family: var(--font-chart); font-size: 1.8rem; margin-bottom: 0.2rem; }
  .print-deckblatt .datum { color: var(--muted); margin-bottom: 1rem; }
  .print-deckblatt table { border-collapse: collapse; width: 100%; max-width: 34rem; }
  .print-deckblatt th, .print-deckblatt td {
    text-align: left; padding: 0.35rem 0.8rem 0.35rem 0;
    border-bottom: 1px solid var(--line); font-size: 0.98rem;
  }
  .print-deckblatt th { font-family: var(--font-chart); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .print-deckblatt td.nr, .print-deckblatt td.tonart { font-family: var(--font-chart); font-weight: 700; }
  .print-song { margin-top: 2.5rem; }
  @media print {
    .print-deckblatt { break-after: page; }
    .print-song { break-before: page; margin-top: 0; }
  }

  /* ---------- A4-Druck: ein Song pro Seite, Schwarzweiß-tauglich ---------- */
  @page { size: A4 portrait; margin: 11mm 12mm; }
  @media print {
    header.chrome, .song-toolbar, #export-reminder, .zurueck,
    .takt-ops, .suffix-chips, .import-hinweis, .import-feld { display: none !important; }
    body { background: #fff; }
    main { padding: 0; max-width: none; margin: 0; }
    .sheet-head { border-color: #000; }
    .sheet-body {
      /* Zweispaltig auch im Druck — die Mobile-Regel (max-width) gilt hier nicht.
         Die pro Song eingestellte Spaltenteilung (--split) gilt auch auf Papier. */
      grid-template-columns: minmax(0, calc(var(--split, 55) * 1%)) 0 minmax(0, 1fr) !important;
      gap: 0 6mm;
      zoom: var(--pscale, 1);
    }
    .split-divider { display: none; }
    .lyr-sec, .grid-sec { break-inside: avoid; }
    /* Farbcodes → Rahmenstile: Strophe durchgezogen, Refrain doppelt, Bridge gestrichelt */
    .sec-mark {
      color: #000 !important; background: #fff !important;
      border: 1pt solid #000;
    }
    .bars { border-color: #000; background: #fff; }
    [data-sectype="refrain"] .bars { border-style: double; border-width: 3pt; }
    [data-sectype="refrain"] .sec-mark { border-style: double; border-width: 2pt; }
    [data-sectype="bridge"] .bars, [data-sectype="bridge"] .sec-mark { border-style: dashed; }
    [data-sectype="intro"] .bars, [data-sectype="intro"] .sec-mark,
    [data-sectype="solo"] .bars, [data-sectype="solo"] .sec-mark,
    [data-sectype="zwischenspiel"] .bars, [data-sectype="zwischenspiel"] .sec-mark { border-style: dotted; }
    .bar { min-height: 2.2rem; }
    .bar:not(:nth-child(4n+1)) { border-left-color: #000; }
    .bar:nth-child(n+5) { border-top-color: #000; }
    /* Badge ohne Farbe lesbar: weiß mit schwarzem Rand */
    .wdh-badge { background: #fff; color: #000; border: 1pt solid #000; }
  }
</style>
