<!-- ============================================================
     CORE: reine Logik ohne DOM. Wird vom Node-Test-Harness
     (test/harness.mjs) extrahiert und headless getestet.
     ============================================================ -->
<script id="core">
window.SheetsCore = (function () {
  'use strict';

  // Akkordsymbol: Root (A-G + optional #/b) + Suffix + optionaler Slash-Bass
  const CHORD_RE = /^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/;
  const SUFFIX_RE = /^(m|maj|min|dim|aug|sus|add|ø|°|[0-9])*[0-9]*$/;
  const SPECIALS = ['%', 'N.C.'];

  function parseChord(symbol) {
    if (typeof symbol !== 'string' || symbol.trim() === '') return null;
    const s = symbol.trim();
    if (SPECIALS.includes(s)) return { special: s };
    const m = s.match(CHORD_RE);
    if (!m) return null;
    const suffix = m[2] || '';
    // Suffix muss wie ein Akkordzusatz aussehen, sonst ist es kein Akkord ("Hello")
    // Alterationen (b9, #11, …) und "alt" für Jazz-Charts (iReal-Import)
    if (suffix && !/^(m|maj|min|dim|aug|sus[24]?|add[0-9]+|alt|ø|°|\+|-|[b#](?:5|6|9|11|13)|[0-9])+$/.test(suffix)) return null;
    return { root: m[1], suffix, bass: m[3] || null };
  }

  const NOTES_SHARP = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
  const NOTES_FLAT  = ['C', 'Db', 'D', 'Eb', 'E', 'F', 'Gb', 'G', 'Ab', 'A', 'Bb', 'B'];

  // Enharmonische Sonderfälle außerhalb beider Tabellen
  const NOTE_ALIAS = { Cb: 11, Fb: 4, 'E#': 5, 'B#': 0 };

  function noteIndex(name) {
    let i = NOTES_SHARP.indexOf(name);
    if (i === -1) i = NOTES_FLAT.indexOf(name);
    if (i === -1 && name in NOTE_ALIAS) i = NOTE_ALIAS[name];
    return i;
  }

  function transposeNote(name, semitones, useFlats) {
    const i = noteIndex(name);
    if (i === -1) return name;
    const j = ((i + semitones) % 12 + 12) % 12;
    return (useFlats ? NOTES_FLAT : NOTES_SHARP)[j];
  }

  function transposeChord(symbol, semitones, opts) {
    const useFlats = !!(opts && opts.useFlats);
    const parsed = parseChord(symbol);
    if (!parsed) return symbol;
    if (parsed.special) return symbol;
    if (semitones === 0) return symbol;
    let out = transposeNote(parsed.root, semitones, useFlats) + parsed.suffix;
    if (parsed.bass) out += '/' + transposeNote(parsed.bass, semitones, useFlats);
    return out;
  }

  // Dur-Tonarten, die nach Quintenzirkel mit Bs notiert werden.
  // Gb (6 Vorzeichen) zählt zu den Bs, das enharmonische F# zu den Kreuzen —
  // wer die Tonart als Gb eingibt, will Bs sehen, und umgekehrt.
  const FLAT_MAJOR_KEYS = ['F', 'Bb', 'Eb', 'Ab', 'Db', 'Gb', 'Cb'];

  function keyPrefersFlats(key) {
    if (typeof key !== 'string' || key === '') return false;
    let root = key.replace(/m(in)?$/, '');
    const isMinor = root !== key;
    if (isMinor) {
      // Parallele Durtonart: kleine Terz über der Moll-Wurzel.
      // Beide Schreibweisen prüfen, weil die Liste Flat-Namen führt
      // (Gm → Parallele Bb, als Kreuz-Name wäre das A#).
      return FLAT_MAJOR_KEYS.includes(transposeNote(root, 3, true)) ||
             FLAT_MAJOR_KEYS.includes(transposeNote(root, 3, false));
    }
    return FLAT_MAJOR_KEYS.includes(root);
  }

  // Pitch-Klassen, deren Dur-Tonart mit Bs notiert wird (F, Bb, Eb, Ab, Db).
  // 6 (F#/Gb) fehlt bewusst: Tie-Break zugunsten der Kreuz-Schreibweise.
  const FLAT_TARGET_PITCHES = [5, 10, 3, 8, 1];

  function transposeKey(key, semitones) {
    if (typeof key !== 'string' || key === '') return key;
    const root = key.replace(/m(in)?$/, '');
    const isMinor = root !== key;
    let i = noteIndex(root);
    if (i === -1) return key;
    if (isMinor) i = (i + 3) % 12; // über die parallele Dur entscheiden
    const j = ((i + semitones) % 12 + 12) % 12;
    const useFlats = FLAT_TARGET_PITCHES.includes(j);
    const newRoot = transposeNote(root, semitones, useFlats);
    return isMinor ? newRoot + 'm' : newRoot;
  }

  function displayNote(name, notation) {
    if (notation !== 'deutsch') return name;
    if (name === 'B') return 'H';
    if (name === 'Bb') return 'B';
    return name;
  }

  function displayChord(symbol, notation) {
    const parsed = parseChord(symbol);
    if (!parsed || parsed.special) return symbol;
    let out = displayNote(parsed.root, notation) + parsed.suffix;
    if (parsed.bass) out += '/' + displayNote(parsed.bass, notation);
    return out;
  }

  // Umkehrung der Anzeigeschicht: getippte deutsche Notation → intern international.
  // H → B, B → Bb; ein bereits international getipptes Bb bleibt Bb.
  function normalizeInputNote(name) {
    if (name === 'H') return 'B';
    if (name === 'B') return 'Bb';
    return name;
  }

  function normalizeInputChord(symbol, notation) {
    if (notation !== 'deutsch' || typeof symbol !== 'string') return symbol;
    const s = symbol.trim();
    if (SPECIALS.includes(s)) return s;
    // H wie ein Root behandeln (parseChord kennt nur A-G)
    const m = s.match(/^([A-H][#b]?)([^/]*)(?:\/([A-H][#b]?))?$/);
    if (!m) return symbol;
    let out = normalizeInputNote(m[1]) + (m[2] || '');
    if (m[3]) out += '/' + normalizeInputNote(m[3]);
    return parseChord(out) ? out : symbol;
  }

  // ---------- UG-Import-Parser (portiert aus strassenmusik-buddy paste-parser.ts) ----------

  const UG_CHORD_RE = /^[A-G][#b]?(m(?:aj)?|min|dim|aug|sus[24]?|add[0-9]*|[0-9])*(\/[A-G][#b]?)?$/;
  const UG_SECTION_RE = /^\[?(intro|verse|chorus|bridge|outro|pre-chorus|interlude|solo|refrain|strophe|tab)\s*(\d*)\]?\s*$/i;
  const UG_SECTION_MAP = {
    intro: 'Intro', verse: 'Strophe', chorus: 'Refrain', bridge: 'Bridge',
    outro: 'Outro', 'pre-chorus': 'Vorrefrain', interlude: 'Zwischenspiel',
    solo: 'Solo', refrain: 'Refrain', strophe: 'Strophe', tab: 'Tab',
  };
  const UG_NOISE = [
    /^tuning:/i, /^capo/i, /^key:/i, /^tempo:/i, /^time signature/i,
    /^[\d,.]+ contributors?$/i, /^difficulty:/i, /^views:?\s*\d/i, /^last edit/i,
    /^chords$/i, /^tabs$/i, /^official$/i, /^ver \d+$/i, /^guitar\s*(pro)?$/i,
    /^ukulele$/i, /^bass$/i, /^drum$/i, /^piano$/i, /^power$/i,
    /^strumming$/i, /^there is no strumming/i, /^create account/i, /^sign up/i,
    /^ultimate-guitar/i, /^www\.ultimate/i, /^tabs\.ultimate/i,
    /^favorites$/i, /^print$/i, /^edit$/i, /^report$/i, /^autoscroll$/i,
    // Transponier-Tabellen mancher Tab-Autoren: "E7 = G7"
    /^[A-G][#b]?\S*\s*=\s*[A-G][#b]?/,
    // Gitarren-Tab-Notationszeilen: "e|---3---", "G|-0-2---"
    /^[a-gA-G][#b]?\|[-–0-9]/,
    // Taktmarkierungszeilen mancher Tabber: "  I     I     I  "
    /^[I|\s]+$/,
    // Deko-Trenner und Legenden: "*****", "= Middle 8"
    /^\*{3,}/,
    /^=/,
  ];

  function ugIsNoise(line) {
    const t = line.trim();
    if (t === '') return false;
    if (UG_NOISE.some(p => p.test(t))) return true;
    // Zeilen, die mit | beginnen, aber keine Akkorde enthalten, sind
    // Legenden ("| / slide up") — Pipe-Taktzeilen haben Akkorde und
    // bleiben unberührt.
    if (t.startsWith('|')) {
      const tokens = ugChordTokens(t);
      return !tokens.some(tok => UG_CHORD_RE.test(tok.clean) || tok.clean === 'N.C.');
    }
    return false;
  }

  // Wiederholungsangaben: "x2", "2x", "(x4)", "[2x]" — entweder hinter einer
  // Akkordzeile (…ENDE) oder als eigene Zeile direkt danach (…ALLEIN).
  // Nur 2…16 zählt; "x24432" (Griffbild) und "x1" bleiben unberührt.
  const UG_MULT_ALLEIN = /^[([]?\s*(?:x\s*(\d+)|(\d+)\s*x)\s*[)\]]?$/i;
  const UG_MULT_ENDE = /\s+[([]?\s*(?:x\s*(\d+)|(\d+)\s*x)\s*[)\]]?\s*\*?$/i;
  function ugMultiplikator(m) {
    const n = m ? parseInt(m[1] || m[2], 10) : 1;
    return n >= 2 && n <= 16 ? n : 1;
  }

  function ugChordTokens(line) {
    // Tokens mit Spaltenposition, Deko-Zeichen entfernt
    const tokens = [];
    const re = /\S+/g;
    let m;
    while ((m = re.exec(line)) !== null) {
      tokens.push({ raw: m[0], clean: m[0].replace(/[()[\]|:,*]/g, ''), pos: m.index });
    }
    return tokens;
  }

  function ugIsChordLine(line) {
    const t = line.trim();
    if (!t || UG_SECTION_RE.test(t)) return false;
    // Pipe- und Deko-Tokens (clean leer) zählen nicht mit — sonst drücken
    // Taktstrich-Zeilen wie "| C | F |" die Akkord-Quote unter 50 %.
    const tokens = ugChordTokens(t).filter(tok => tok.clean !== '');
    if (tokens.length === 0) return false;
    const chordCount = tokens.filter(tok => UG_CHORD_RE.test(tok.clean) || tok.clean === 'N.C.').length;
    return chordCount / tokens.length >= 0.5;
  }

  // Abschnittsmarker erkennen — bekannte Typen (UG_SECTION_RE) werden auf
  // deutsche Namen gemappt, jede sonstige [Klammer]-Zeile wird generisch als
  // Abschnitt übernommen (Post-Chorus, Instrumental, Keyboard Solo, …).
  // Keine Marker: Wiederholungsangaben ([2x]), Akkorde ([C]), lange Zeilen.
  function ugMarker(line) {
    const t = line.trim();
    const secM = t.match(UG_SECTION_RE);
    if (secM && t !== '') {
      const base = UG_SECTION_MAP[secM[1].toLowerCase()] || secM[1];
      return { label: secM[2] ? base + ' ' + secM[2] : base };
    }
    // Klammer-Zusatz hinter dem Marker erlaubt: "[Verse 1] (clean guitar)"
    const klammer = t.match(/^\[([^\]]+)\]\s*(?:\(.*\))?$/);
    if (!klammer) return null;
    const inhalt = klammer[1].trim();
    if (inhalt.length === 0 || inhalt.length > 30) return null;
    if (/^(\d+\s*x|x\s*\d+|\d+)$/i.test(inhalt)) return null;
    if (UG_CHORD_RE.test(inhalt)) return null;
    const numM = inhalt.match(/^(\d+)\.\s*(strophe|verse)$/i);
    if (numM) return { label: 'Strophe ' + numM[1] };
    // Bekannte Typen auch im generischen Pfad deutsch mappen —
    // "[Verse 1] (clean guitar)" landet hier, nicht in UG_SECTION_RE
    const teile = inhalt.match(/^(.*?)\s*(\d*)$/);
    const bekannt = UG_SECTION_MAP[teile[1].toLowerCase()];
    if (bekannt) return { label: teile[2] ? bekannt + ' ' + teile[2] : bekannt };
    return { label: inhalt };
  }

  // Takt-Heuristik. Mit zeilenTakte > 0 (Default 4) gilt: eine Textzeile
  // entspricht so vielen Takten — Akkorde werden sequenziell gesetzt, der
  // Rest mit % (gehalten) aufgefüllt. Das trifft den häufigen Fall, dass
  // der letzte Akkord einer Zeile weiterklingt (UG notiert das nicht).
  // Instrumental-Zeilen (ohne Text) und Zeilen mit ≥ zeilenTakte Akkorden
  // bleiben eins-zu-eins. Mit zeilenTakte = 0: ein Akkord pro Takt, plus
  // Spezialfall „zwei enge Akkorde über einer Phrase" → ein geteilter Takt.
  function ugLineToBars(chordLine, lyricLine, zeilenTakte) {
    // Pipe-Notation "| C | F G |" nennt Taktgrenzen explizit — direkt
    // übernehmen, keine Heuristik und keine %-Auffüllung.
    if (chordLine.includes('|')) {
      const segmente = chordLine.split('|').slice(1, -1);
      const bars = [];
      for (const seg of segmente) {
        const segChords = ugChordTokens(seg).filter(t => UG_CHORD_RE.test(t.clean) || t.clean === 'N.C.');
        bars.push(segChords.length ? segChords.map(c => c.clean) : ['%']);
      }
      if (bars.length) return bars;
    }
    const chords = ugChordTokens(chordLine).filter(t => UG_CHORD_RE.test(t.clean) || t.clean === 'N.C.');
    if (chords.length === 0) return [];
    const hatText = !!(lyricLine && lyricLine.trim());

    if (zeilenTakte > 0) {
      if (!hatText || chords.length >= zeilenTakte) return chords.map(c => [c.clean]);
      const bars = chords.map(c => [c.clean]);
      while (bars.length < zeilenTakte) bars.push(['%']);
      return bars;
    }

    if (chords.length === 2 && hatText) {
      const len = lyricLine.length;
      const rel1 = chords[0].pos / len;
      const rel2 = chords[1].pos / len;
      if (rel1 < 0.25 && rel2 >= 0.35 && rel2 <= 0.65) {
        return [[chords[0].clean, chords[1].clean]];
      }
    }
    return chords.map(c => [c.clean]);
  }

  function parseUGText(raw, opts) {
    const zeilenTakte = opts && 'zeilenTakte' in opts ? opts.zeilenTakte : 4;
    const warnungen = [];
    const lines = String(raw || '').replace(/\r\n/g, '\n').split('\n')
      .map(l => l.replace(/\[ch\](.*?)\[\/ch\]/g, '$1').replace(/\[\/?tab\]/g, ''));

    // Phase 1: Header (Titel, Künstler, Key, Capo) bis zur ersten Section/Akkordzeile
    let titel = '', kuenstler = '', key = null, capo = 0, contentStart = 0;
    const headerLines = [];
    for (let i = 0; i < Math.min(lines.length, 25); i++) {
      const t = lines[i].trim();
      if (!t) continue;
      const capoM = t.match(/capo[:\s]*(\d+)/i);
      if (capoM) { capo = parseInt(capoM[1], 10); continue; }
      const keyM = t.match(/^key[:\s]*([A-G][#b]?m?)\s*$/i);
      if (keyM) { key = keyM[1]; continue; }
      if (ugMarker(t) !== null || ugIsChordLine(t)) { contentStart = i; break; }
      if (ugIsNoise(t)) continue;
      headerLines.push(t);
      contentStart = i + 1;
    }
    if (headerLines.length >= 1) {
      titel = headerLines[0].replace(/\s+(chords?|tabs?|guitar|ukulele|bass)$/i, '').trim();
    }
    if (headerLines.length >= 2) kuenstler = headerLines[1];
    else if (titel) warnungen.push('Künstler nicht automatisch erkannt');

    // Phase 2: Abschnitts-Instanzen sammeln (Label, Takte, Textzeilen)
    const instanzen = [];
    let aktuelle = null;
    let pendingChordLine = null;
    let pendingMult = 1;
    // Takte der zuletzt abgeschlossenen Zeile: ein "[2x]" direkt danach
    // schreibt sie aus (von/bis in aktuelle.takte)
    let letzteZeile = null;

    const zeileEinfuegen = (chordLine, lyricLine) => {
      const bars = ugLineToBars(chordLine, lyricLine, zeilenTakte);
      const von = aktuelle.takte.length;
      for (let k = 0; k < pendingMult; k++) aktuelle.takte.push(...bars.map(b => b.slice()));
      letzteZeile = bars.length ? { von, bis: aktuelle.takte.length } : null;
      pendingMult = 1;
    };
    const flushPending = () => {
      if (pendingChordLine !== null && aktuelle) {
        zeileEinfuegen(pendingChordLine, null);
        pendingChordLine = null;
      }
    };
    const startInstanz = (label) => {
      flushPending();
      aktuelle = { label, takte: [], zeilen: [] };
      instanzen.push(aktuelle);
      letzteZeile = null;
    };

    for (let i = contentStart; i < lines.length; i++) {
      const line = lines[i];
      const t = line.trim();
      if (ugIsNoise(t)) continue;
      // Eigene Wiederholungszeile ("[2x]", "x4") direkt nach einer Akkordzeile
      const multM = t !== '' ? t.match(UG_MULT_ALLEIN) : null;
      const mult = ugMultiplikator(multM);
      if (multM && mult > 1 && aktuelle) {
        if (pendingChordLine !== null) { pendingMult = mult; continue; }
        if (letzteZeile) {
          const teil = aktuelle.takte.slice(letzteZeile.von, letzteZeile.bis);
          for (let k = 1; k < mult; k++) aktuelle.takte.push(...teil.map(b => b.slice()));
          letzteZeile = null;
          continue;
        }
      }
      const mk = t !== '' ? ugMarker(t) : null;
      if (mk) {
        startInstanz(mk.label);
        continue;
      }
      if (!t) { flushPending(); letzteZeile = null; continue; }
      if (!aktuelle) startInstanz('Song');
      if (ugIsChordLine(t)) {
        flushPending();
        const endM = line.match(UG_MULT_ENDE);
        const endN = ugMultiplikator(endM);
        pendingChordLine = endN > 1 ? line.replace(UG_MULT_ENDE, '') : line;
        pendingMult = endN;
      } else {
        if (pendingChordLine !== null) {
          zeileEinfuegen(pendingChordLine, line);
          pendingChordLine = null;
        } else {
          letzteZeile = null;
        }
        aktuelle.zeilen.push(t);
      }
    }
    flushPending();

    // Akkord-Übersichten am Tab-Anfang aussortieren: eine automatisch
    // erzeugte "Song"-Instanz ohne jede Textzeile ist keine Musik, sondern
    // die Akkord-Liste des Autors — sofern danach echte Abschnitte folgen.
    // Ebenso verworfen: leere Instanzen (keine Takte, kein Text) — typisch
    // Marker, deren Inhalt reine Tab-Notation war ([Intro Tab]). Zeilen,
    // die nur Klammer-Spielanweisungen sind ("(Bass)", "(x10)"), zählen
    // dabei nicht als Text.
    const nurAnweisungen = (zeilen) => zeilen.every(z => /^\(.*\)$/.test(z.trim()));
    const gefiltert = instanzen.filter((inst, i) =>
      !(inst.label === 'Song' && inst.zeilen.length === 0 && instanzen.length > 1)
      && !(inst.takte.length === 0 && nurAnweisungen(inst.zeilen) && instanzen.length > 1));
    instanzen.length = 0;
    instanzen.push(...gefiltert);

    // Phase 3: Deduplizierung — gleiche Basis + identische Takte → ein Raster.
    const { abschnitte, text } = abschnitteAusInstanzen(instanzen);

    // Phase 4: Qualität + Tonart-Fallback
    let confidence = 'high';
    const alleTakte = abschnitte.flatMap(a => a.takte);
    if (alleTakte.length === 0) {
      warnungen.push('Keine Akkord-Zeilen erkannt');
      confidence = 'low';
    }
    if (!titel) { titel = 'Unbekannter Song'; confidence = 'low'; }
    if (!key && alleTakte.length > 0 && alleTakte[0].length > 0) {
      const m = alleTakte[0][0].match(/^([A-G][#b]?m?)/);
      if (m) key = m[1];
    }

    return {
      titel, kuenstler,
      originalTonart: key || 'C',
      capo,
      abschnitte, text,
      warnungen, confidence,
    };
  }

  // Wiederholungen für die Anzeige verdichten (reine Ableitung, `takte` bleibt
  // ausgeschrieben). Ergebnis: Segmente { takte } (ausgeschrieben) und
  // { muster, n } (Muster n-mal; `muster` = Takte des ersten Vorkommens).
  // Einheit = Akkordtakt plus folgende %-Takte; gleich, wenn die Akkorde
  // gleich sind (Haltelänge zählt nicht), ausgenommen die Musterränder: die
  // erste Einheit muss gleich lang gehalten sein, die letzte gleich "gehalten
  // oder nicht". So bleibt die Wiederholung an der Zeilengrenze (Brightside:
  // "G C % %" ≠ "G C Fmaj7", Phase "C % % %" davor), Hotel-Strophen mit
  // anderer Auffüllung innen bleiben gleich. Periode 2–8 Einheiten, n ≥ 2, exakt.
  // Mehrere Kandidaten: größte Abdeckung, dann Ende am Bereichsende (Phase),
  // dann kleinste Periode, dann frühester Start. Der Rest davor/dahinter wird
  // auf dieselbe Weise weiter verdichtet.
  function verdichteTakte(takte) {
    const einheiten = [];
    for (const t of takte || []) {
      const letzte = einheiten[einheiten.length - 1];
      if (t.length === 1 && t[0] === '%' && letzte) letzte.takte.push(t);
      else einheiten.push({ key: t.join('+'), takte: [t] });
    }
    const gleich = (a, b) => einheiten[a].key === einheiten[b].key;
    const lang = (i) => einheiten[i].takte.length;
    const MAX_PERIODE = 8;

    function besterBlock(lo, hi) {
      let best = null;
      for (let p = 2; p <= MAX_PERIODE && 2 * p <= hi - lo; p++) {
        for (let s = lo; s + 2 * p <= hi; s++) {
          // Muster aus lauter gleichen Einheiten ist Halten, keine Wiederholung
          let alleGleich = true;
          for (let j = 1; j < p && alleGleich; j++) alleGleich = gleich(s, s + j);
          if (alleGleich) continue;
          let n = 1;
          while (s + (n + 1) * p <= hi) {
            const o = s + n * p;
            let ok = lang(o) === lang(s) && (lang(o + p - 1) > 1) === (lang(s + p - 1) > 1);
            for (let j = 0; j < p && ok; j++) ok = gleich(s + j, o + j);
            if (!ok) break;
            n++;
          }
          if (n < 2) continue;
          const cov = n * p;
          const endetAmEnde = s + cov === hi;
          if (!best || cov > best.cov
            || (cov === best.cov && endetAmEnde && !best.endetAmEnde)
            || (cov === best.cov && endetAmEnde === best.endetAmEnde && p < best.p)) {
            best = { s, p, n, cov, endetAmEnde };
          }
        }
      }
      return best;
    }

    const flach = (lo, hi) => einheiten.slice(lo, hi).flatMap(e => e.takte);
    const segmente = [];
    function bereich(lo, hi) {
      if (lo >= hi) return;
      const b = besterBlock(lo, hi);
      if (!b) {
        const letztes = segmente[segmente.length - 1];
        if (letztes && !letztes.muster) letztes.takte.push(...flach(lo, hi));
        else segmente.push({ takte: flach(lo, hi) });
        return;
      }
      bereich(lo, b.s);
      segmente.push({ muster: flach(b.s, b.s + b.p), n: b.n });
      bereich(b.s + b.cov, hi);
    }
    bereich(0, einheiten.length);
    return segmente;
  }

  // Instanzen (Label, Takte, Textzeilen in Spielreihenfolge) zu Abschnitten
  // und Textblöcken verdichten: gleiche Basis + identische Takte → ein Raster.
  // Zwei Pässe: erst Signaturen pro Basis zählen, dann benennen —
  // eine Basis mit nur einer Akkordfolge heißt schlicht "Strophe",
  // mit mehreren bleiben die Labels ("Strophe 1", "Strophe 2") erhalten.
  // Genutzt vom UG- und vom iReal-Import.
  function abschnitteAusInstanzen(instanzen) {
    const basisVon = (label) => label.replace(/\s+\d+$/, '');
    const sigVon = (inst) => basisVon(inst.label) + '::' + (inst.taktart || '') + '::' + JSON.stringify(inst.takte);
    const sigsProBasis = new Map();
    for (const inst of instanzen) {
      const basis = basisVon(inst.label);
      if (!sigsProBasis.has(basis)) sigsProBasis.set(basis, new Set());
      sigsProBasis.get(basis).add(sigVon(inst));
    }

    const abschnitte = [];
    const text = [];
    const nameFuer = new Map(); // Signatur → vergebener Abschnittsname

    for (const inst of instanzen) {
      const basis = basisVon(inst.label);
      const sig = sigVon(inst);
      let name = nameFuer.get(sig);
      if (name === undefined) {
        name = sigsProBasis.get(basis).size === 1 ? basis : inst.label;
        if (abschnitte.some(a => a.name === name)) {
          name = freierAbschnittsname(abschnitte, name);
        }
        nameFuer.set(sig, name);
        const abschnitt = { name, takte: inst.takte };
        if (inst.taktart) abschnitt.taktart = inst.taktart;
        abschnitte.push(abschnitt);
      }
      text.push({ ref: name, zeilen: inst.zeilen });
    }
    return { abschnitte, text };
  }

  // Freien Abschnittsnamen finden. Vorhandene Nummern-Suffixe werden erst
  // abgestreift („Song 2 2 1" → Basis „Song"), dann wird hochgezählt —
  // so entstehen nie verkettete Namen wie „Strophe 2 2".
  function freierAbschnittsname(abschnitte, wunsch) {
    const basis = String(wunsch || 'Teil').replace(/(\s+\d+)+$/, '') || 'Teil';
    let name = basis;
    for (let n = 2; abschnitte.some(a => a.name === name); n++) name = basis + ' ' + n;
    return name;
  }

  // Textblock an einer Zeile teilen und den referenzierten Abschnitt an der
  // anteiligen Taktgrenze mitteilen. Referenzieren andere Textblöcke dasselbe
  // Raster, bleibt es unangetastet — der geteilte Block bekommt eigene Kopien.
  function splitTextBlock(song, blockIdx, zeile) {
    const block = song.text[blockIdx];
    if (!block) return false;
    const zeilen = block.zeilen || [];
    if (zeile <= 0 || zeile >= zeilen.length) return false;
    const secIdx = song.abschnitte.findIndex(a => a.name === block.ref);
    if (secIdx === -1) return false;
    const sec = song.abschnitte[secIdx];
    const splitBar = Math.round(zeile * sec.takte.length / zeilen.length);

    const geteilt = song.text.some((b, i) => i !== blockIdx && b.ref === block.ref);
    let zweiterName;
    if (geteilt) {
      const a = { name: freierAbschnittsname(song.abschnitte, block.ref), takte: sec.takte.slice(0, splitBar).map(t => t.slice()) };
      song.abschnitte.splice(secIdx + 1, 0, a);
      const b = { name: freierAbschnittsname(song.abschnitte, block.ref), takte: sec.takte.slice(splitBar).map(t => t.slice()) };
      song.abschnitte.splice(secIdx + 2, 0, b);
      block.ref = a.name;
      zweiterName = b.name;
    } else {
      const neu = { name: freierAbschnittsname(song.abschnitte, sec.name), takte: sec.takte.slice(splitBar) };
      if (sec.taktart) neu.taktart = sec.taktart;
      sec.takte = sec.takte.slice(0, splitBar);
      song.abschnitte.splice(secIdx + 1, 0, neu);
      zweiterName = neu.name;
    }

    song.text.splice(blockIdx + 1, 0, { ref: zweiterName, zeilen: zeilen.slice(zeile) });
    block.zeilen = zeilen.slice(0, zeile);
    return true;
  }

  // ---------- iReal Pro ----------
  // Format (verifiziert 20.10.2026 an ireal-reader und echten Forums-Playlists):
  // irealb://<prozent-kodiert>, Songs durch "===" getrennt, bei Playlists als
  // letztes Feld der Playlist-Name. Ein Song:
  //   Titel=Komponist==Stil=Tonart==1r34LbKcu7<Musik>=Begleitstil=BPM=Wiederholungen
  // Die Musik ist in 50-Zeichen-Blöcken verwürfelt.

  const IREAL_MUSIK_PREFIX = '1r34LbKcu7';

  function irealObfusc50(s) {
    const n = s.split('');
    for (let i = 0; i < 5; i++) { n[49 - i] = s[i]; n[i] = s[49 - i]; }
    for (let i = 10; i < 24; i++) { n[49 - i] = s[i]; n[i] = s[49 - i]; }
    return n.join('');
  }

  // Selbstinvers: dieselbe Funktion ver- und entwürfelt. Ein Block bleibt
  // unverwürfelt, wenn danach weniger als 2 Zeichen folgen.
  function irealVerwuerfeln(s) {
    let r = '';
    while (s.length > 50) {
      const p = s.slice(0, 50);
      s = s.slice(50);
      r += s.length < 2 ? p : irealObfusc50(p);
    }
    return r + s;
  }

  function irealLinksFinden(text) {
    return String(text || '').match(/irealb:\/\/[^"'\s<>]+/g) || [];
  }

  function irealLinkLesen(link) {
    let body = String(link).replace(/^irealb:\/\//, '');
    try { body = decodeURIComponent(body); } catch (e) { return { name: '', songs: [], fehler: 'Link nicht lesbar' }; }
    const teile = body.split('===');
    const name = teile.length > 1 ? teile.pop() : '';
    const songs = [];
    for (const teil of teile) {
      const f = teil.split('=');
      const mi = f.findIndex(x => x.startsWith(IREAL_MUSIK_PREFIX));
      if (mi < 2) continue;
      // Tonart = letztes Feld vor der Musik, das wie eine Tonart aussieht;
      // ältere Links haben weniger Leerfelder, deshalb suchen statt zählen.
      let ki = -1;
      for (let i = mi - 1; i >= 1; i--) {
        if (/^[A-G][#b]?-?$/.test(f[i])) { ki = i; break; }
      }
      songs.push({
        titel: f[0] || 'Unbekannter Song',
        komponist: f[1] || '',
        stil: ki > 1 ? (f[ki - 1] || f[ki - 2] || '') : '',
        tonart: ki > 0 ? f[ki] : 'C',
        musik: irealVerwuerfeln(f[mi].slice(IREAL_MUSIK_PREFIX.length)),
        begleitstil: f[mi + 1] || '',
        bpm: parseInt(f[mi + 2], 10) || null,
      });
    }
    return { name, songs };
  }

  // iReal-Qualität → stotco-Suffix. "^" allein heißt in iReal maj7.
  function irealAkkordZuStotco(sym) {
    const m = String(sym).match(/^([A-G][#b]?)([^/]*)(?:\/([A-G][#b]?))?$/);
    if (!m) return sym;
    const q = m[2];
    let s = q;
    if (q.startsWith('-^')) s = 'mmaj' + (q.slice(2) || '7');
    else if (q.startsWith('^')) s = 'maj' + (q.slice(1) || '7');
    else if (q.startsWith('-')) s = 'm' + q.slice(1);
    else if (q.startsWith('h')) s = 'm7b5' + q.slice(1).replace(/^7/, '');
    else if (q.startsWith('o')) s = 'dim' + q.slice(1);
    return m[1] + s + (m[3] ? '/' + m[3] : '');
  }

  function stotcoAkkordZuIreal(sym) {
    const p = parseChord(sym);
    if (!p) return String(sym);
    if (p.special === 'N.C.') return 'n';
    if (p.special === '%') return 'x';
    let s = p.suffix;
    // Schreibweisen, die iReal selbst nie benutzt: "sus4" heißt dort "sus",
    // "sus2" heißt "2", und "^" allein wäre maj7 — "maj" ohne Zahl ist der Dur-Dreiklang.
    if (s === 'maj') s = '';
    else if (s === 'sus2') s = '2';
    else if (s === 'aug7') s = '7#5';
    s = s.replace(/sus4$/, 'sus').replace(/add2$/, 'add9');
    if (/^m7b5/.test(s)) s = 'h7' + s.slice(4);
    else if (/^ø/.test(s)) s = 'h7' + s.replace(/^ø7?/, '');
    else if (/^mmaj/.test(s)) s = '-^' + s.slice(4);
    else if (/^maj/.test(s)) s = '^' + s.slice(3);
    else if (/^min/.test(s)) s = '-' + s.slice(3);
    else if (/^m/.test(s)) s = '-' + s.slice(1);
    else if (/^dim/.test(s)) s = 'o' + s.slice(3);
    else if (/^°/.test(s)) s = 'o' + s.slice(1);
    else if (/^aug/.test(s)) s = '+' + s.slice(3);
    return p.root + s + (p.bass ? '/' + p.bass : '');
  }

  function irealTaktart(code) {
    if (code === '12') return '12/8';
    return code.length === 2 ? code[0] + '/' + code[1] : code.slice(0, -1) + '/' + code.slice(-1);
  }

  function irealTaktCode(taktart) {
    if (taktart === '12/8') return '12';
    return String(taktart || '4/4').replace('/', '');
  }

  const IREAL_ABSCHNITT = { i: 'Intro', V: 'Strophe' };
  const IREAL_AKKORD_RE = /^[A-GW](?:sus|alt|add|[+\-^\dhob#])*(?:\/[A-G][#b]?)?/;

  // Zerlegt den entwürfelten Musik-String in Takte, so wie sie notiert sind.
  // Start-Zeichen (Abschnitt, Segno, Volta, {, Taktart) hängen am gerade
  // geöffneten Takt, End-Zeichen (}, Z, ], Kommentare) am letzten Takt mit
  // Akkorden. Ein Q in einem Takt mit Akkorden ist das "zur Coda"-Zeichen,
  // ein Q am Anfang eines leeren Takts der Coda-Beginn.
  function irealTakteLesen(musik) {
    const takte = [];
    let label = 'A';
    let taktart = '4/4';
    let letzteWurzel = null;
    let altWeggelassen = false;
    const neu = () => ({ label, akkorde: [], taktart, neuerAbschnitt: false, kommentare: [] });
    let akt = neu();
    takte.push(akt);
    const neuerTakt = () => { if (akt.akkorde.length) { akt = neu(); takte.push(akt); } };
    const gefuellt = () => (akt.akkorde.length || takte.length < 2 ? akt : takte[takte.length - 2]);

    let s = String(musik || '');
    let m;
    while (s.length) {
      if (s.startsWith('XyQ')) { s = s.slice(3); continue; }
      if ((m = s.match(/^<([^>]*)>/))) {
        // "*36" am Anfang ist eine Positionsangabe, XyQ ist Füllzeichen
        const k = m[1].replace(/^\*\d{2}/, '').replace(/XyQ/g, '').trim();
        if (k) gefuellt().kommentare.push(k);
        s = s.slice(m[0].length); continue;
      }
      if ((m = s.match(/^\*([A-Za-z])/))) {
        label = IREAL_ABSCHNITT[m[1]] || m[1].toUpperCase();
        akt.label = label;
        akt.neuerAbschnitt = true;
        s = s.slice(2); continue;
      }
      if ((m = s.match(/^T(\d{2,3})/))) {
        taktart = irealTaktart(m[1]);
        akt.taktart = taktart;
        s = s.slice(m[0].length); continue;
      }
      if (s.startsWith('r|XyQ')) {
        // Die beiden vorigen Takte wiederholen: aktueller + ein neuer Takt
        const n = takte.length;
        const a = takte[n - 3], b = takte[n - 2];
        if (a && b) {
          akt.akkorde = a.akkorde.slice();
          akt = neu();
          akt.akkorde = b.akkorde.slice();
          takte.push(akt);
        }
        s = s.slice(5); continue;
      }
      if (s.startsWith('Kcl')) { neuerTakt(); akt.akkorde = ['%']; s = s.slice(3); continue; }
      if (s.startsWith('LZ')) { neuerTakt(); s = s.slice(2); continue; }
      if ((m = s.match(/^N(\d)/))) { akt.volta = parseInt(m[1], 10); s = s.slice(2); continue; }
      if ((m = s.match(/^\([^)]*\)/))) { altWeggelassen = true; s = s.slice(m[0].length); continue; }
      const c = s[0];
      if (c === ']') { gefuellt().doppelEnde = true; neuerTakt(); s = s.slice(1); continue; }
      if (c === '|' || c === '[') { neuerTakt(); s = s.slice(1); continue; }
      if (c === '{') { neuerTakt(); akt.wdhStart = true; s = s.slice(1); continue; }
      if (c === '}') { gefuellt().wdhEnde = true; neuerTakt(); s = s.slice(1); continue; }
      if (c === 'Z') { gefuellt().ende = true; neuerTakt(); s = s.slice(1); continue; }
      if (c === 'x') { akt.akkorde = ['%']; s = s.slice(1); continue; }
      if (c === 'n') { akt.akkorde.push('N.C.'); s = s.slice(1); continue; }
      if (c === 'S') { akt.segno = true; s = s.slice(1); continue; }
      if (c === 'Q') { akt.coda = true; s = s.slice(1); continue; }
      if ((m = s.match(IREAL_AKKORD_RE))) {
        let a = m[0];
        // W = unsichtbarer Grundton: letzter Grundton + neuer Bass
        if (a[0] === 'W') a = letzteWurzel ? letzteWurzel + a.slice(1) : a.slice(1);
        else letzteWurzel = a.match(/^[A-G][#b]?/)[0];
        if (a) akt.akkorde.push(a);
        s = s.slice(m[0].length); continue;
      }
      s = s.slice(1); // Leerzeichen, Komma, s/l (Akkordgröße), p, f, U, Y …
    }
    const gefiltert = takte.filter(t => t.akkorde.length);
    return { takte: gefiltert, taktart: gefiltert.length ? gefiltert[0].taktart : '4/4', altWeggelassen };
  }

  // Schreibt die notierten Takte in Spielreihenfolge aus.
  function irealFormAusschreiben(takte) {
    const warnungen = [];
    const n = takte.length;
    const txt = (t) => t.kommentare.join(' ').toLowerCase();

    // Die D.C./D.S.-Anweisung steht irgendwo im letzten Abschnitt — gesprungen
    // wird erst an dessen Ende (Schlussstrich, Doppelstrich, nächster Abschnitt).
    const kommentarIdx = takte.findIndex(t => /d\.\s?[cs]\./.test(txt(t)));
    let sprungIdx = kommentarIdx;
    while (sprungIdx !== -1 && sprungIdx < n - 1 && !takte[sprungIdx].ende && !takte[sprungIdx].doppelEnde &&
           !takte[sprungIdx + 1].neuerAbschnitt && !takte[sprungIdx + 1].coda) sprungIdx++;
    const sprung = kommentarIdx === -1 ? null : {
      idx: sprungIdx,
      ziel: /d\.\s?s\./.test(txt(takte[kommentarIdx])) ? 'segno' : 'anfang',
      bis: /fine/.test(txt(takte[kommentarIdx])) ? 'fine' : /coda/.test(txt(takte[kommentarIdx])) ? 'coda' : 'ende',
    };

    const codaIdx = takte.map((t, i) => (t.coda ? i : -1)).filter(i => i >= 0);
    const zurCoda = codaIdx.length >= 2 ? codaIdx[0] : -1;
    const codaStart = codaIdx.length >= 2 ? codaIdx[codaIdx.length - 1] : -1;
    if (codaIdx.length === 1) warnungen.push('Nur ein Coda-Zeichen gefunden — Form prüfen');
    const segnoIdx = takte.findIndex(t => t.segno);
    const fineIdx = takte.findIndex(t => /\bfine\b/.test(txt(t)) && !/al fine/.test(txt(t)));

    const voltaMax = (start) => {
      let max = 0;
      for (let i = start; i < n && !(i > start && takte[i].wdhStart); i++) {
        if (takte[i].volta) max = Math.max(max, takte[i].volta);
      }
      return max;
    };
    // Durchläufe: Kommentar "3x", sonst höchste Volta, mindestens 2
    const anzahl = (t, start) => {
      const m = txt(t).match(/(\d+)\s*x/);
      return m ? parseInt(m[1], 10) : Math.max(2, voltaMax(start));
    };
    const wdhEndeAb = (von) => {
      for (let i = von; i < n; i++) if (takte[i].wdhEnde) return i;
      return -1;
    };
    const letzteVolta = (von) => {
      let max = takte[von].volta;
      for (let i = von + 1; i < n && !takte[i].wdhStart && takte[i].volta !== 1; i++) {
        if (takte[i].volta) max = Math.max(max, takte[i].volta);
      }
      return max;
    };

    // Durchläufe über Voltenzahl (nur bei ausdrücklichem "Nx"-Kommentar): Volta 1
    // wiederholt sich, die letzte Volta kommt im letzten Durchlauf.
    const voltaFuerDurchlauf = (wdh) => {
      const ende = wdhEndeAb(wdh.start);
      const m = ende !== -1 ? txt(takte[ende]).match(/(\d+)\s*x/) : null;
      const max = voltaMax(wdh.start);
      if (m && max >= 2 && parseInt(m[1], 10) > max) {
        return wdh.pass < parseInt(m[1], 10) ? 1 : max;
      }
      return wdh.pass;
    };

    const folge = [];
    let wdh = null;          // { start, pass } der laufenden Wiederholung
    let gesprungen = false;  // D.C./D.S. schon genommen
    let neuerEinsatz = false;
    let zurueck = false;     // gerade an den Wiederholungsanfang gesprungen
    let pos = 0;
    let guard = 0;

    while (pos < n) {
      if (++guard > 2000) { warnungen.push('Form-Ausschreibung abgebrochen — Form prüfen'); break; }
      const t = takte[pos];
      if (t.wdhStart && !zurueck) wdh = { start: pos, pass: 1 };
      zurueck = false;

      // Falsche Volta überspringen
      if (t.volta && wdh) {
        const soll = gesprungen ? letzteVolta(pos) : voltaFuerDurchlauf(wdh);
        if (t.volta !== soll) {
          const ziel = takte.findIndex((x, i) => i > pos && x.volta === soll);
          const ende = wdhEndeAb(pos);
          pos = ziel !== -1 ? ziel : (ende !== -1 ? ende + 1 : pos + 1);
          neuerEinsatz = true;
          continue;
        }
      }

      folge.push({ idx: pos, neuerEinsatz });
      neuerEinsatz = false;

      // Zur Coda: nach dem D.C./D.S. — oder ohne Sprunganweisung im letzten
      // Durchlauf der Wiederholung, in der das Coda-Zeichen steht
      if (pos === zurCoda && codaStart > pos) {
        const ende = wdh ? wdhEndeAb(wdh.start) : -1;
        const letzterDurchlauf = wdh && ende !== -1 && wdh.pass >= anzahl(takte[ende], wdh.start);
        if (gesprungen ? sprung.bis === 'coda' : (!sprung && letzterDurchlauf)) {
          pos = codaStart;
          neuerEinsatz = true;
          continue;
        }
      }
      if (gesprungen && sprung.bis === 'fine' && pos === fineIdx) break;

      if (t.wdhEnde && wdh && !gesprungen && wdh.pass < anzahl(t, wdh.start)) {
        wdh.pass++;
        pos = wdh.start;
        zurueck = true;
        neuerEinsatz = true;
        continue;
      }

      if (sprung && pos === sprung.idx && !gesprungen) {
        gesprungen = true;
        let ziel = 0;
        if (sprung.ziel === 'segno') {
          if (segnoIdx === -1) warnungen.push('D.S. ohne Segno — springe an den Anfang');
          else ziel = segnoIdx;
        }
        pos = ziel;
        wdh = null;
        neuerEinsatz = true;
        continue;
      }
      if (t.ende) break;
      pos++;
    }

    const erreicht = new Set(folge.map(f => f.idx));
    const fehlend = n - erreicht.size;
    if (fehlend > 0) warnungen.push(fehlend + ' Takte im Ablauf nicht erreicht — Form prüfen');
    return { folge, codaStart, warnungen };
  }

  function irealSongZuStotco(rec) {
    const gelesen = irealTakteLesen(rec.musik);
    const form = irealFormAusschreiben(gelesen.takte);
    const warnungen = form.warnungen.slice();
    const unbekannt = new Set();
    const taktwechsel = new Set();

    const wandle = (a) => {
      if (a === '%' || a === 'N.C.') return a;
      const s = irealAkkordZuStotco(a);
      if (parseChord(s)) return s;
      unbekannt.add(a);
      return a; // roh stehen lassen — sichtbar statt verschluckt
    };
    // "%" am Instanz-Anfang meint den notierten Vortakt, nicht den gespielten
    const aufgeloest = (idx) => {
      let i = idx;
      while (i > 0 && gelesen.takte[i].akkorde.length === 1 && gelesen.takte[i].akkorde[0] === '%') i--;
      return gelesen.takte[i].akkorde;
    };

    const instanzen = [];
    let akt = null;
    let imCoda = false;
    for (const { idx, neuerEinsatz } of form.folge) {
      const t = gelesen.takte[idx];
      if (idx === form.codaStart) imCoda = true;
      else if (t.neuerAbschnitt) imCoda = false;
      const label = imCoda ? 'Coda' : t.label;
      if (!akt || neuerEinsatz || t.neuerAbschnitt || idx === form.codaStart || label !== akt.label) {
        akt = { label, takte: [], zeilen: [] };
        if (t.taktart !== gelesen.taktart) akt.taktart = t.taktart;
        instanzen.push(akt);
      } else if (t.taktart !== (akt.taktart || gelesen.taktart)) {
        taktwechsel.add(label + ': ' + t.taktart);
      }
      const quelle = akt.takte.length === 0 && t.akkorde[0] === '%' ? aufgeloest(idx) : t.akkorde;
      akt.takte.push(quelle.map(wandle));
    }

    if (unbekannt.size) warnungen.push('Akkorde nicht erkannt: ' + [...unbekannt].join(', '));
    if (taktwechsel.size) warnungen.push('Taktwechsel mitten im Abschnitt: ' + [...taktwechsel].join(', '));
    if (gelesen.altWeggelassen) warnungen.push('Alternativ-Akkorde (in Klammern) weggelassen');

    const { abschnitte, text } = abschnitteAusInstanzen(instanzen);
    const km = String(rec.tonart || '').match(/^([A-G][#b]?)(-)?$/);
    // Spielhinweise ("Repeat and fade") behalten, Form-Anweisungen sind ausgeschrieben
    const hinweise = gelesen.takte.flatMap(t => t.kommentare)
      .filter(k => !/d\.\s?[cs]\.|^\d+\s*x$|^fine$/i.test(k));
    return {
      song: {
        titel: rec.titel,
        kuenstler: rec.komponist || '',
        originalTonart: km ? km[1] + (km[2] ? 'm' : '') : 'C',
        taktart: gelesen.taktart,
        tempo: rec.bpm || null,
        transposeOffset: 0,
        abschnitte: abschnitte.length ? abschnitte : [{ name: 'A', takte: [[]] }],
        text: text.length ? text : [{ ref: 'A', zeilen: [] }],
        notizen: hinweise.concat(warnungen).join('. '),
        ireal: { stil: rec.stil || '', begleitstil: rec.begleitstil || '', komponist: rec.komponist || '' },
        ungeprueft: true,
      },
      warnungen,
    };
  }

  // Fehlt ein Stil, nimmt iReal "Pop" (in Forums-Playlists der häufigste
  // Stil, also sicher bekannt).
  const IREAL_STANDARD_STIL = 'Pop';

  // "=" trennt Felder — darf in keinem Wert vorkommen
  function irealFeld(s) {
    return String(s || '').replace(/=/g, '-').trim();
  }

  // Wie echte iReal-Links: alles außer A-Z, a-z, 0-9 prozent-kodiert
  function irealProzent(s) {
    return Array.from(s).map(c => {
      if (/[A-Za-z0-9]/.test(c)) return c;
      const e = encodeURIComponent(c);
      return e !== c ? e : '%' + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, '0');
    }).join('');
  }

  function stotcoSongZuIreal(song, offset) {
    const off = offset == null ? (song.transposeOffset || 0) : offset;
    // Offset 0: Schreibweise der Tonart unverändert (transposeKey würde Ebm→D#m, Gb→F# umschreiben)
    let zielTonart = off === 0 ? (song.originalTonart || 'C') : transposeKey(song.originalTonart || 'C', off);
    const useFlats = keyPrefersFlats(zielTonart);
    // Tonart wie die Akkorde schreiben (Dm +1: D#m → Ebm, weil die Akkorde Eb/Bb heißen)
    if (off !== 0 && useFlats) zielTonart = zielTonart.replace(/^[A-G][#b]?/, r => NOTES_FLAT[noteIndex(r)] || r);
    const tr = (a) => (a === '%' || a === 'N.C.' ? a : transposeChord(a, off, { useFlats }));
    const form = song.text && song.text.length ? song.text.map(b => b.ref) : song.abschnitte.map(a => a.name);
    const songTakt = song.taktart || '4/4';

    // Abschnittsmarker: A-D behalten ihren Buchstaben, Rest bekommt freie
    const vergeben = new Map();
    const frei = ['A', 'B', 'C', 'D'];
    for (const a of song.abschnitte) {
      if (/^[A-D]$/.test(a.name) && frei.includes(a.name)) {
        vergeben.set(a.name, a.name);
        frei.splice(frei.indexOf(a.name), 1);
      }
    }
    const marker = (name) => {
      const basis = name.replace(/(\s+\d+)+$/, '').toLowerCase();
      if (basis === 'intro') return 'i';
      if (basis === 'strophe' || basis === 'verse') return 'V';
      if (!vergeben.has(name)) vergeben.set(name, frei.shift() || '');
      return vergeben.get(name);
    };

    let musik = '';
    let aktTakt = null;
    for (const ref of form) {
      const ab = song.abschnitte.find(a => a.name === ref);
      if (!ab || !ab.takte.length) continue;
      const m = marker(ref);
      musik += '[' + (m ? '*' + m : '');
      const takt = ab.taktart || songTakt;
      if (takt !== aktTakt) { musik += 'T' + irealTaktCode(takt); aktTakt = takt; }
      // Jedes Zeichen ist in iReal eine Zelle (4/4 = 4 Zellen): ab drei
      // Akkorden Komma statt Leerzeichen, sonst läuft der Takt über.
      musik += ab.takte.map(t => (t.length ? t.map(a => stotcoAkkordZuIreal(tr(a))).join(t.length > 2 ? ',' : ' ') : ' ')).join('|') + ']';
    }
    musik = musik.replace(/\]$/, 'Z');

    const km = zielTonart.match(/^([A-G][#b]?)(m)?$/);
    const meta = song.ireal || {};
    return [
      irealFeld(song.titel) || 'Unbekannter Song',
      irealFeld(meta.komponist || song.kuenstler) || 'Unbekannt',
      '',
      irealFeld(meta.stil) || IREAL_STANDARD_STIL,
      km ? km[1] + (km[2] ? '-' : '') : 'C',
      '',
      IREAL_MUSIK_PREFIX + irealVerwuerfeln(musik),
      irealFeld(meta.begleitstil),
      String(song.tempo || 0),
      '1',
    ].join('=');
  }

  function irealPlaylistLink(songStrings, name) {
    const body = songStrings.length === 1 && !name
      ? songStrings[0]
      : songStrings.join('===') + '===' + (irealFeld(name) || 'stotco sheets');
    return 'irealb://' + irealProzent(body);
  }

  function irealDublette(songs, titel) {
    const t = String(titel || '').trim().toLowerCase();
    return songs.some(s => String(s.titel || '').trim().toLowerCase() === t);
  }

  // ---------- UG-PDF pro Song ----------

  const PDF_MAX_BYTES = 20 * 1024 * 1024;

  function pdfPfad(songId) {
    return 'pdf/' + songId + '.pdf';
  }

  // null wenn die Datei als PDF taugt, sonst deutscher Fehlertext.
  function pdfDateiOk(datei) {
    const name = String((datei && datei.name) || '');
    const typ = String((datei && datei.type) || '');
    const groesse = Number((datei && datei.size) || 0);
    if (typ !== 'application/pdf' && !/\.pdf$/i.test(name)) return 'Keine PDF-Datei';
    if (groesse <= 0) return 'Datei ist leer';
    if (groesse > PDF_MAX_BYTES) return 'Datei größer als 20 MB';
    return null;
  }

  // Kleinschreibung, Akzente/Satzzeichen weg, „the“ am Anfang/„, the“ am Ende weg.
  function pdfNormName(s) {
    let t = String(s || '').toLowerCase();
    if (t.normalize) t = t.normalize('NFD').replace(/[̀-ͯ]/g, '');
    t = t.replace(/[^a-z0-9]+/g, ' ').trim().replace(/\s+/g, ' ');
    t = t.replace(/^the /, '').replace(/ the$/, '');
    return t;
  }

  // Song zur UG-Übergabe: erst ugTabId, sonst eindeutiger Treffer Titel+Künstler, sonst null.
  function songFuerUgPdf(songs, info) {
    const liste = Array.isArray(songs) ? songs : [];
    const tabId = info && info.tabId != null ? Number(info.tabId) : null;
    if (tabId) {
      const perId = liste.find(s => Number(s.ugTabId) === tabId);
      if (perId) return perId;
    }
    const titel = pdfNormName(info && info.titel);
    const kuenstler = pdfNormName(info && info.kuenstler);
    if (!titel) return null;
    const treffer = liste.filter(s =>
      pdfNormName(s.titel) === titel && pdfNormName(s.kuenstler) === kuenstler);
    return treffer.length === 1 ? treffer[0] : null;
  }

  // '#ugpdf=<tabId>|<titel>|<kuenstler>' (Teile encodeURIComponent-kodiert).
  function parseUgPdfHash(hash) {
    const m = /^#ugpdf=(.*)$/.exec(String(hash || ''));
    if (!m) return null;
    const teile = m[1].split('|').map(t => {
      try { return decodeURIComponent(t); } catch (e) { return t; }
    });
    const tabId = parseInt(teile[0], 10);
    return {
      tabId: Number.isFinite(tabId) ? tabId : null,
      titel: teile[1] || '',
      kuenstler: teile[2] || '',
    };
  }

  // '#ugimport=<base64-Text>[&tab=<tabId>]' vom Userscript; null wenn nicht lesbar.
  function parseUgImportHash(hash) {
    const m = /^#ugimport=([^&]*)(?:&tab=([0-9]+))?/.exec(String(hash || ''));
    if (!m) return null;
    try {
      const text = decodeURIComponent(escape(atob(m[1])));
      return { text, tabId: m[2] ? parseInt(m[2], 10) : null };
    } catch (e) {
      return null;
    }
  }

  return {
    pdfPfad,
    pdfDateiOk,
    songFuerUgPdf,
    parseUgPdfHash,
    parseUgImportHash,
    irealTakteLesen,
    stotcoSongZuIreal,
    irealPlaylistLink,
    irealDublette,
    irealFormAusschreiben,
    irealSongZuStotco,
    parseChord,
    transposeChord,
    irealVerwuerfeln,
    irealLinksFinden,
    irealLinkLesen,
    irealAkkordZuStotco,
    stotcoAkkordZuIreal,
    irealTaktart,
    irealTaktCode,
    transposeKey,
    keyPrefersFlats,
    displayChord,
    normalizeInputChord,
    parseUGText,
    verdichteTakte,
    splitTextBlock,
    freierAbschnittsname,
    abschnitteAusInstanzen,
  };
})();
</script>

<!-- ============================================================
     APP: State, Persistenz, Rendering. Läuft nur im Browser.
     ============================================================ -->
<script id="app">
(function () {
  'use strict';

  const C = window.SheetsCore;
  const STORAGE_KEY = 'stotco-sheets';

  // Geteilte Setliste (Nur-Lese-Ansicht für die Band): ?s=<id>#k=<schlüssel>.
  // Die Daten liegen verschlüsselt in share/<id>.json, der Schlüssel steht nur
  // im Link-Teil nach # und geht nie an den Server.
  const SHARE = (() => {
    const id = new URLSearchParams(location.search).get('s');
    const k = /[#&]k=([\w-]+)/.exec(location.hash);
    return id && /^[\w-]{6,40}$/.test(id) ? { id, key: k ? k[1] : null } : null;
  })();
  const SHARE_BASIS = 'https://stotco.de/sheets/';
  const SHARE_LOKAL_KEY = SHARE ? 'stotco-share-' + SHARE.id : null;
  const EXPORT_REMINDER_THRESHOLD = 20;

  // Nicht persistierter UI-Zustand
  // Anzeige: Wiederholungen verdichten (Kompakt) oder alles ausschreiben.
  // Wahl pro Gerät, bewusst außerhalb des Songstate (kein Export, kein Backup).
  const ANSICHT_KEY = 'stotco-sheets-ansicht';
  function ladeKompakt() {
    try { return localStorage.getItem(ANSICHT_KEY) !== 'ausfuehrlich'; } catch (e) { return true; }
  }
  function speichereKompakt(kompakt) {
    try { localStorage.setItem(ANSICHT_KEY, kompakt ? 'kompakt' : 'ausfuehrlich'); } catch (e) { /* ohne Speicher geht die Wahl nur bis zum Neuladen */ }
  }

  const ui = {
    view: 'library', songId: null, suche: '',
    kompakt: ladeKompakt(),    // verdichtetes Raster im Lesemodus (Bearbeiten ist immer ausführlich)
    edit: false,               // Bearbeiten-Modus in der Songansicht
    barSel: null,              // { sec, bar } — ausgewählter Takt im Editor
    barErr: false,             // letzter Takt-Commit war ungültig
    zeigeQuelle: false,        // UG-Originaltext im Editor einblenden
    loeschen: null,            // Song-ID mit offener Lösch-Bestätigung
    importPrefill: null,       // vom Userscript übergebener UG-Text (#ugimport=)
    importPrefillTab: null,    // UG-Tab-ID dazu (&tab=), wird beim Übernehmen zu song.ugTabId
    pdfZuordnung: null,        // { info, blob } — UG-PDF aus der Inbox wartet auf Song-Auswahl
    bibTab: 'songs',           // Bibliothek: 'songs' | 'setlisten'
    setlistId: null,           // geöffnete Setliste
    slLoeschen: null,          // Setlist-ID mit offener Lösch-Bestätigung
    dragIdx: null,             // Drag-and-drop: gezogener Eintrag
    stageCtx: null,            // Bühne aus Setliste: { setlistId, pos }
    neuerAbschnitt: false,     // Typ-Auswahl für neuen Abschnitt sichtbar
    irealExport: false,        // Export-Panel in der Setliste offen
    pdfStatus: null,           // { songId, text } — Meldung der PDF-Ablage in der Song-Leiste
  };

  const defaultState = () => ({
    songs: [],
    setlisten: [],
    einstellungen: { notation: 'international' },
    _aenderungenSeitExport: 0,
  });

  function demoSong() {
    return {
      id: 'demo-beispielsong',
      titel: 'Beispielsong',
      kuenstler: 'stotco',
      originalTonart: 'C',
      taktart: '4/4',
      tempo: 100,
      transposeOffset: 0,
      abschnitte: [
        { name: 'Intro', takte: [['C'], ['%'], ['F'], ['G']] },
        { name: 'Strophe', takte: [['C'], ['F'], ['C'], ['F'], ['Am'], ['G'], ['F'], ['G']] },
        { name: 'Refrain', takte: [['Am', 'G'], ['F'], ['Am', 'G'], ['F', 'G']] },
        { name: 'Bridge', takte: [['Dm'], ['N.C.'], ['F'], ['G']] },
      ],
      text: [
        { ref: 'Intro', zeilen: [] },
        { ref: 'Strophe', zeilen: ['Dies ist die erste Strophe,', 'nur ein Demo, nichts Reales,', 'zeigt wie Text und Raster koppeln,', 'jede Marke, jede Farbe.'] },
        { ref: 'Refrain', zeilen: ['Und der Refrain kommt wieder,', 'zwei Akkorde pro Takt.'] },
        { ref: 'Strophe', zeilen: ['Zweite Strophe, gleiches Raster,', 'rechts steht es nur einmal,', 'denn wiederholte Teile', 'brauchen keine Kopie.'] },
        { ref: 'Refrain', zeilen: ['Und der Refrain kommt wieder,', 'zwei Akkorde pro Takt.'] },
        { ref: 'Bridge', zeilen: ['Hier die Bridge mit Pause —', 'N.C. heißt: nichts spielen.'] },
      ],
      notizen: 'Demo-Song zum Ausprobieren — kann gelöscht werden.',
    };
  }

  let state = loadState();

  function loadState() {
    if (SHARE) return defaultState(); // wird nach dem Entschlüsseln befüllt
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const s = defaultState();
        s.songs.push(demoSong());
        return s;
      }
      return Object.assign(defaultState(), JSON.parse(raw));
    } catch (e) {
      console.warn('State konnte nicht geladen werden, starte leer:', e);
      return defaultState();
    }
  }

  function saveState() {
    if (SHARE) {
      // Band-Ansicht: nur die eigenen Transpositionen merken, nichts zurückschreiben
      try {
        const sl = state.setlisten[0];
        localStorage.setItem(SHARE_LOKAL_KEY, JSON.stringify({
          songs: Object.fromEntries(state.songs.map(x => [x.id, x.transposeOffset || 0])),
          eintraege: sl ? sl.eintraege.map(e => e.offsetOverride == null ? null : e.offsetOverride) : [],
        }));
      } catch (e) { /* ohne Speicher gilt die Tonart nur bis zum Neuladen */ }
      render();
      return;
    }
    state._aenderungenSeitExport += 1;
    planeTeilenAktualisieren();
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    render();
  }

  // ---------- Setlisten teilen (verschlüsselt auf stotco.de/sheets) ----------

  function b64url(bytes) {
    let bin = '';
    new Uint8Array(bytes).forEach(b => { bin += String.fromCharCode(b); });
    return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function vonB64url(str) {
    const bin = atob(str.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((str.length + 3) % 4));
    return Uint8Array.from(bin, c => c.charCodeAt(0));
  }
  async function strom(bytes, transform) {
    return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(transform)).arrayBuffer());
  }
  async function aesKey(keyStr, nutzung) {
    return crypto.subtle.importKey('raw', vonB64url(keyStr), 'AES-GCM', false, [nutzung]);
  }
  async function verschluesseln(obj, keyStr) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const roh = await strom(new TextEncoder().encode(JSON.stringify(obj)), new CompressionStream('gzip'));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await aesKey(keyStr, 'encrypt'), roh);
    return { v: 1, iv: b64url(iv), ct: b64url(ct) };
  }
  async function entschluesseln(datei, keyStr) {
    const roh = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: vonB64url(datei.iv) },
      await aesKey(keyStr, 'decrypt'), vonB64url(datei.ct));
    return JSON.parse(new TextDecoder().decode(await strom(roh, new DecompressionStream('gzip'))));
  }

  function teilenLink(sl) {
    return SHARE_BASIS + '?s=' + sl.share.id + '#k=' + sl.share.key;
  }

  // Inhalt der geteilten Setliste: nur ihre Songs, ohne UG-Rohtext, PDF und interne IDs.
  function teilenPayload(sl) {
    const ids = new Set(sl.eintraege.map(e => e.songId));
    return {
      setliste: { id: sl.id, name: sl.name, datum: sl.datum || null, eintraege: sl.eintraege },
      songs: state.songs.filter(x => ids.has(x.id)).map(x => {
        const k = Object.assign({}, x);
        delete k.ugQuelle; delete k.pdf; delete k.ugTabId;
        return k;
      }),
      einstellungen: { notation: state.einstellungen.notation },
    };
  }

  // Verschlüsselt und legt share/<id>.json auf dem Mac mini ab; serve.py lädt
  // danach auf stotco.de hoch. Unveränderter Inhalt wird nicht neu hochgeladen.
  async function teileSetliste(sl, erzwingen) {
    if (!sl.share) {
      sl.share = { id: b64url(crypto.getRandomValues(new Uint8Array(9))), key: b64url(crypto.getRandomValues(new Uint8Array(32))) };
    }
    const payload = teilenPayload(sl);
    const hash = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(JSON.stringify(payload))));
    if (!erzwingen && sl.share.hash === hash) return 'unveraendert';
    payload.stand = new Date().toISOString();
    const datei = await verschluesseln(payload, sl.share.key);
    const res = await fetch('share/' + sl.share.id + '.json', { method: 'PUT', body: JSON.stringify(datei) });
    if (!res.ok) throw new Error('Ablage fehlgeschlagen (HTTP ' + res.status + ')');
    sl.share.hash = hash;
    sl.share.stand = payload.stand;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    return 'hochgeladen';
  }

  // Nach Änderungen geteilte Setlisten still nachziehen (gebündelt, 10 s Ruhe).
  let teilenTimer = null;
  function planeTeilenAktualisieren() {
    if (SHARE || !state.setlisten.some(x => x.share)) return;
    clearTimeout(teilenTimer);
    teilenTimer = setTimeout(() => {
      state.setlisten.filter(x => x.share).forEach(x =>
        teileSetliste(x).catch(e => console.warn('Teilen-Aktualisierung:', e)));
    }, 10000);
  }

  async function ladeGeteilteSetliste() {
    const view = document.getElementById('view');
    const fehler = (text) => view.replaceChildren(el('div', { class: 'sl-leer' }, text));
    if (!SHARE.key) { fehler('Der Link ist unvollständig - bitte den ganzen Link verwenden.'); return; }
    try {
      const res = await fetch('share/' + SHARE.id + '.json?v=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('nicht gefunden');
      const daten = await entschluesseln(await res.json(), SHARE.key);
      state = Object.assign(defaultState(), {
        songs: daten.songs, setlisten: [daten.setliste],
        einstellungen: Object.assign(defaultState().einstellungen, daten.einstellungen),
      });
      try {
        const lokal = JSON.parse(localStorage.getItem(SHARE_LOKAL_KEY) || 'null');
        if (lokal) {
          state.songs.forEach(x => { if (lokal.songs && x.id in lokal.songs) x.transposeOffset = lokal.songs[x.id]; });
          state.setlisten[0].eintraege.forEach((e, i) => {
            const o = lokal.eintraege && lokal.eintraege[i];
            if (o == null) delete e.offsetOverride; else e.offsetOverride = o;
          });
        }
      } catch (e) { /* eigene Tonarten gehen dann verloren, Inhalt bleibt */ }
      ui.view = 'setlist'; ui.setlistId = daten.setliste.id;
      document.title = daten.setliste.name + ' - stotco sheets';
      ui.teilenStand = daten.stand || null;
      render();
    } catch (e) {
      fehler('Setliste konnte nicht geladen werden (Link falsch oder nicht mehr gültig).');
    }
  }

  function exportJson() {
    const data = { ...state };
    delete data._aenderungenSeitExport;
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'stotco-sheets-' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(a.href);
    state._aenderungenSeitExport = 0;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    render();
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!Array.isArray(data.songs)) throw new Error('Keine songs[] in der Datei');
        state = Object.assign(defaultState(), data, { _aenderungenSeitExport: 0 });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        render();
      } catch (e) {
        alert('Import fehlgeschlagen: ' + e.message);
      }
    };
    reader.readAsText(file);
  }

  // ---------- DOM-Helfer (immer textContent, nie innerHTML → kein Escaping-Problem) ----------

  function el(tag, attrs, ...children) {
    const node = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v == null) continue;
        if (k === 'class') node.className = v;
        else if (k === 'style') node.style.cssText = v;
        else if (k === 'value') node.value = v;
        else if (k.startsWith('on')) node.addEventListener(k.slice(2), v);
        else node.setAttribute(k, v);
      }
    }
    for (const child of children.flat()) {
      if (child == null) continue;
      node.append(typeof child === 'string' ? document.createTextNode(child) : child);
    }
    return node;
  }

  // ---------- Abschnittsfarben ----------

  const SECTION_TYPES = [
    [/^(strophe|verse)/, 'strophe'],
    [/^(refrain|chorus)/, 'refrain'],
    [/^bridge/, 'bridge'],
    [/^(intro|outro|ende)/, 'intro'],
    [/^solo/, 'solo'],
    [/^(zwischenspiel|interlude|instrumental)/, 'zwischenspiel'],
    [/^(vor-?refrain|pre-?chorus)/, 'vorrefrain'],
    [/^(nach-?refrain|post-?chorus)/, 'vorrefrain'],
  ];

  function sectionType(name) {
    const n = (name || '').toLowerCase().trim();
    for (const [re, type] of SECTION_TYPES) {
      if (re.test(n)) return type;
    }
    return 'intro';
  }

  function sectionColor(name) {
    return 'var(--c-' + sectionType(name) + ')';
  }

  // Anzeigename der Abschnittsmarke: Nummern-Suffixe („Strophe 2") werden
  // nur bei bekannten Abschnittstypen entfernt — intern bleiben die Namen
  // eindeutig, weil Textblöcke Abschnitte über den Namen referenzieren.
  function anzeigeName(name) {
    const basis = (name || '').replace(/(\s+\d+)+$/, '');
    if (basis === name) return name;
    const n = basis.toLowerCase().trim();
    return SECTION_TYPES.some(([re]) => re.test(n)) ? basis : name;
  }

  // ---------- Akkord-Anzeige (Transposition + Notation) ----------

  function chordForDisplay(song, symbol) {
    const off = song.transposeOffset || 0;
    const zielTonart = C.transposeKey(song.originalTonart || 'C', off);
    const useFlats = C.keyPrefersFlats(zielTonart);
    return C.displayChord(
      C.transposeChord(symbol, off, { useFlats }),
      state.einstellungen.notation
    );
  }

  function keyForDisplay(song) {
    const off = song.transposeOffset || 0;
    const ziel = C.transposeKey(song.originalTonart || 'C', off);
    return C.displayChord(ziel, state.einstellungen.notation);
  }

  // ---------- Views ----------
