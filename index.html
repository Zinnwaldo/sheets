      el('div', { class: 'song-toolbar' },
        el('span', { class: 'tab-schalter' },
          el('button', {
            class: ui.bibTab === 'songs' ? 'aktiv' : '',
            onclick: () => { ui.bibTab = 'songs'; render(); },
          }, 'Songs'),
          el('button', {
            class: ui.bibTab === 'setlisten' ? 'aktiv' : '',
            onclick: () => { ui.bibTab = 'setlisten'; render(); },
          }, 'Setlisten (' + state.setlisten.length + ')')
        )
      )
    );

    if (ui.bibTab === 'setlisten') {
      renderSetlists(view);
      return;
    }

    const q = ui.suche.toLowerCase();
    const treffer = state.songs.filter(s =>
      (s.titel + ' ' + s.kuenstler).toLowerCase().includes(q));

    view.append(
      el('div', { class: 'song-toolbar' },
        el('button', {
          class: 'primaer',
          onclick: () => {
            const song = {
              id: 'song-' + Date.now().toString(36),
              titel: 'Neuer Song', kuenstler: '', originalTonart: 'C',
              taktart: '4/4', tempo: null, transposeOffset: 0,
              abschnitte: [{ name: 'Strophe', takte: [[], [], [], []] }],
              text: [{ ref: 'Strophe', zeilen: [] }],
              notizen: '',
            };
            state.songs.push(song);
            ui.view = 'song'; ui.songId = song.id; ui.edit = true;
            saveState();
          },
        }, '+ Neuer Song'),
        el('button', {
          onclick: () => { ui.view = 'import'; render(); },
        }, 'Import (UG-Text)'),
        el('button', {
          onclick: () => { ui.view = 'irealimport'; render(); },
        }, 'Import (iReal Pro)')
      ),
      el('input', {
        class: 'lib-suche', type: 'search', placeholder: 'Suche nach Titel oder Künstler…',
        value: ui.suche,
        oninput: (e) => { ui.suche = e.target.value; render(); },
      }),
      treffer.length === 0
        ? el('div', { class: 'lib-leer' },
            state.songs.length === 0
              ? 'Noch keine Songs — per Import laden oder neuen Song anlegen.'
              : 'Kein Treffer für „' + ui.suche + '".')
        : el('div', {}, treffer.map(song =>
            el('div', {
              class: 'lib-item',
              role: 'button', tabindex: '0',
              onclick: () => { ui.view = 'song'; ui.songId = song.id; render(); },
              onkeydown: (e) => { if (e.key === 'Enter') { ui.view = 'song'; ui.songId = song.id; render(); } },
            },
              el('span', { class: 't' }, song.titel),
              el('span', { class: 'a' }, song.kuenstler || ''),
              el('span', { class: 'k' }, keyForDisplay(song)),
              ui.loeschen === song.id
                ? el('button', {
                    class: 'loeschen bestaetigen',
                    onclick: (e) => {
                      e.stopPropagation();
                      state.songs = state.songs.filter(s => s.id !== song.id);
                      ui.loeschen = null;
                      saveState();
                    },
                  }, 'wirklich löschen?')
                : el('button', {
                    class: 'loeschen', title: 'Song löschen',
                    onclick: (e) => { e.stopPropagation(); ui.loeschen = song.id; render(); },
                  }, '✕')
            )))
    );
    const suche = view.querySelector('.lib-suche');
    if (document.activeElement === document.body && ui.suche) suche.focus();
  }

  // ---------- Editor-Operationen ----------

  function commitBar(song, secIdx, barIdx, rawValue) {
    const tokens = rawValue.trim().split(/\s+/).filter(Boolean);
    const normalized = tokens.map(t => C.normalizeInputChord(t, state.einstellungen.notation));
    if (normalized.some(t => !C.parseChord(t))) {
      ui.barErr = true;
      return false;
    }
    ui.barErr = false;
    song.abschnitte[secIdx].takte[barIdx] = normalized;
    return true;
  }

  function selectNextBar(song) {
    if (!ui.barSel) return;
    const { sec, bar } = ui.barSel;
    const takte = song.abschnitte[sec].takte;
    if (bar + 1 < takte.length) {
      ui.barSel = { sec, bar: bar + 1 };
    } else if (sec + 1 < song.abschnitte.length) {
      ui.barSel = { sec: sec + 1, bar: 0 };
    } else {
      ui.barSel = null;
    }
  }

  function selectPrevBar(song) {
    if (!ui.barSel) return;
    const { sec, bar } = ui.barSel;
    if (bar > 0) {
      ui.barSel = { sec, bar: bar - 1 };
    } else if (sec > 0) {
      const prev = song.abschnitte[sec - 1].takte;
      ui.barSel = prev.length ? { sec: sec - 1, bar: prev.length - 1 } : null;
    }
  }

  function barInputValue(song, secIdx, barIdx) {
    return song.abschnitte[secIdx].takte[barIdx]
      .map(a => C.displayChord(a, state.einstellungen.notation))
      .join(' ');
  }

  const SUFFIX_CHIPS = ['m', '7', 'm7', 'maj7', 'sus4', 'sus2', 'dim', 'add9', '/'];

  function renderBarToolbar(song) {
    const { sec, bar } = ui.barSel;
    const takte = song.abschnitte[sec].takte;
    const ops = el('div', { class: 'takt-ops' },
      el('button', { onclick: () => { takte.splice(bar, 0, []); saveState(); } }, '+ davor'),
      el('button', { onclick: () => { takte.splice(bar + 1, 0, []); ui.barSel = { sec, bar: bar + 1 }; saveState(); } }, '+ danach'),
      el('button', {
        onclick: () => {
          // teilen: ein Akkord → derselbe zweimal (halbe Takte), danach editieren
          const t = takte[bar];
          if (t.length === 1) { takte[bar] = [t[0], t[0]]; saveState(); }
        },
      }, 'teilen'),
      el('button', {
        title: 'Akkord hält einen weiteren Takt (%)',
        onclick: () => { takte.splice(bar + 1, 0, ['%']); ui.barSel = { sec, bar: bar + 1 }; saveState(); },
      }, 'halten %'),
      el('button', {
        onclick: () => {
          takte.splice(bar, 1);
          ui.barSel = takte.length ? { sec, bar: Math.min(bar, takte.length - 1) } : null;
          saveState();
        },
      }, 'Takt löschen')
    );
    const chips = el('div', { class: 'suffix-chips' },
      SUFFIX_CHIPS.map(s =>
        el('button', {
          // mousedown statt click, damit das Bar-Input den Fokus nicht verliert
          onmousedown: (e) => {
            e.preventDefault();
            const input = document.querySelector('.bar.aktiv input');
            if (input) { input.value += s; input.focus(); }
          },
        }, s))
    );
    return el('div', {}, ops, chips);
  }

  // Akkorde eines Takts im Lesemodus (ohne Editor)
  function ruheTaktInhalt(bar, song, takt) {
    for (const akkord of takt) {
      const shown = chordForDisplay(song, akkord);
      const cls = akkord === '%' ? 'ch rep' : akkord === 'N.C.' ? 'ch nc' : 'ch';
      bar.append(el('span', { class: cls }, shown));
    }
  }

  // Verdichtete Ansicht: pro Segment ein eigenes Raster, Wiederholungsmuster
  // mit Badge "n×". Gibt null zurück, wenn nichts zu verdichten ist — dann
  // zeigt renderBars das normale Raster.
  function renderBarsKompakt(song, abschnitt) {
    const segmente = C.verdichteTakte(abschnitt.takte);
    if (!segmente.some(sg => sg.muster)) return null;
    const wrap = el('div', { class: 'bars-segmente' });
    for (const sg of segmente) {
      const grid = el('div', { class: 'bars' + (sg.muster ? ' wdh' : '') });
      for (const takt of (sg.muster || sg.takte)) {
        const bar = el('div', { class: 'bar' });
        ruheTaktInhalt(bar, song, takt);
        grid.append(bar);
      }
      if (sg.muster) {
        grid.append(el('span', { class: 'wdh-badge', title: 'Wiederholung: ' + sg.n + ' Mal' }, sg.n + '×'));
      }
      wrap.append(grid);
    }
    return wrap;
  }

  // opts.kompakt überschreibt die Geräte-Einstellung (Import-Vorschau: immer ausführlich)
  function renderBars(song, abschnitt, secIdx, opts) {
    const kompakt = opts && 'kompakt' in opts ? opts.kompakt : ui.kompakt && !ui.edit;
    if (kompakt) {
      const k = renderBarsKompakt(song, abschnitt);
      if (k) return k;
    }
    const bars = el('div', { class: 'bars' });
    abschnitt.takte.forEach((takt, barIdx) => {
      const aktiv = ui.edit && ui.barSel && ui.barSel.sec === secIdx && ui.barSel.bar === barIdx;
      const bar = el('div', {
        class: 'bar' + (ui.edit ? ' editierbar' : '') + (aktiv ? ' aktiv' : ''),
        onclick: ui.edit && !aktiv
          ? () => { ui.barSel = { sec: secIdx, bar: barIdx }; ui.barErr = false; render(); }
          : null,
      });
      if (aktiv) {
        bar.append(el('input', {
          value: barInputValue(song, secIdx, barIdx),
          class: ui.barErr ? 'fehler' : '',
          spellcheck: 'false',
          onkeydown: (e) => {
            const input = e.target;
            if (e.key === 'Enter') {
              if (commitBar(song, secIdx, barIdx, input.value)) { selectNextBar(song); saveState(); }
              else render();
            } else if (e.key === 'Escape') {
              ui.barSel = null; ui.barErr = false; render();
            } else if (e.key === 'ArrowRight' && input.selectionStart === input.value.length) {
              e.preventDefault();
              if (commitBar(song, secIdx, barIdx, input.value)) { selectNextBar(song); saveState(); }
            } else if (e.key === 'ArrowLeft' && input.selectionStart === 0 && input.selectionEnd === 0) {
              e.preventDefault();
              if (commitBar(song, secIdx, barIdx, input.value)) { selectPrevBar(song); saveState(); }
            } else if (e.key === 'Backspace' && input.value === '') {
              e.preventDefault();
              const takte = song.abschnitte[secIdx].takte;
              takte.splice(barIdx, 1);
              ui.barSel = takte.length
                ? { sec: secIdx, bar: Math.max(0, barIdx - 1) }
                : null;
              saveState();
            }
          },
          onblur: (e) => {
            // Blur durch Klick auf Chips/Buttons nicht committen — die regeln das selbst
            if (ui.barSel && ui.barSel.sec === secIdx && ui.barSel.bar === barIdx) {
              commitBar(song, secIdx, barIdx, e.target.value);
            }
          },
        }));
      } else {
        ruheTaktInhalt(bar, song, takt);
      }
      bars.append(bar);
    });
    return bars;
  }

  function renderSectionOps(song, secIdx) {
    const abschnitte = song.abschnitte;
    const a = abschnitte[secIdx];
    return el('span', { class: 'sec-ops' },
      el('button', {
        title: 'nach oben', disabled: secIdx === 0 ? '' : null,
        onclick: () => { abschnitte.splice(secIdx - 1, 0, abschnitte.splice(secIdx, 1)[0]); ui.barSel = null; saveState(); },
      }, '↑'),
      el('button', {
        title: 'nach unten', disabled: secIdx === abschnitte.length - 1 ? '' : null,
        onclick: () => { abschnitte.splice(secIdx + 1, 0, abschnitte.splice(secIdx, 1)[0]); ui.barSel = null; saveState(); },
      }, '↓'),
      el('button', {
        onclick: () => {
          const kopie = JSON.parse(JSON.stringify(a));
          kopie.name = C.freierAbschnittsname(abschnitte, a.name);
          abschnitte.splice(secIdx + 1, 0, kopie);
          saveState();
        },
      }, 'duplizieren'),
      el('button', { onclick: () => { a.takte.push([]); saveState(); } }, '+ Takt'),
      el('button', {
        onclick: () => {
          abschnitte.splice(secIdx, 1);
          song.text = song.text.filter(b => b.ref !== a.name);
          ui.barSel = null;
          saveState();
        },
      }, 'Abschnitt löschen')
    );
  }

  function renderGridSection(song, abschnitt, secIdx) {
    const head = el('div', { class: 'grid-head' });
    if (ui.edit) {
      head.append(
        el('input', {
          class: 'sec-rename', value: abschnitt.name, spellcheck: 'false',
          onchange: (e) => {
            const alt = abschnitt.name;
            const neu = e.target.value.trim() || alt;
            abschnitt.name = neu;
            song.text.forEach(b => { if (b.ref === alt) b.ref = neu; });
            saveState();
          },
        }),
        el('input', {
          class: 'sec-taktart', value: abschnitt.taktart || song.taktart || '4/4', spellcheck: 'false',
          title: 'Taktart dieses Abschnitts',
          onchange: (e) => { abschnitt.taktart = e.target.value.trim(); saveState(); },
        }),
        renderSectionOps(song, secIdx)
      );
    } else {
      head.append(
        el('span', { class: 'sec-mark', style: '--sec:' + sectionColor(abschnitt.name) }, anzeigeName(abschnitt.name)),
        el('span', { class: 'taktart' }, abschnitt.taktart || song.taktart || '4/4')
      );
    }
    const teil = el('div', {
      class: 'grid-sec',
      style: '--sec:' + sectionColor(abschnitt.name),
      'data-sectype': sectionType(abschnitt.name),
    }, head, renderBars(song, abschnitt, secIdx));
    if (ui.edit && ui.barSel && ui.barSel.sec === secIdx) {
      teil.append(renderBarToolbar(song));
    }
    return teil;
  }

  function renderTextBlock(song, block, blockIdx) {
    if (!ui.edit) {
      return el('div', { class: 'lyr-sec', 'data-sectype': sectionType(block.ref) },
        el('span', { class: 'sec-mark', style: '--sec:' + sectionColor(block.ref) }, anzeigeName(block.ref)),
        el('div', { class: 'zeilen' }, (block.zeilen || []).join('\n'))
      );
    }
    const zeilenAusText = (value) =>
      value.split('\n').map(z => z.trimEnd()).filter((z, i, arr) =>
        z !== '' || i < arr.length - 1);

    const textarea = el('textarea', {
      spellcheck: 'false',
      onchange: (e) => {
        block.zeilen = zeilenAusText(e.target.value);
        saveState();
      },
    }, (block.zeilen || []).join('\n'));

    return el('div', { class: 'lyr-sec lyr-edit' },
      el('select', {
        onchange: (e) => { block.ref = e.target.value; saveState(); },
      }, song.abschnitte.map(a =>
        el('option', { value: a.name, selected: a.name === block.ref ? '' : null }, a.name))),
      el('span', { class: 'sec-ops' },
        el('button', {
          disabled: blockIdx === 0 ? '' : null,
          onclick: () => { song.text.splice(blockIdx - 1, 0, song.text.splice(blockIdx, 1)[0]); saveState(); },
        }, '↑'),
        el('button', {
          disabled: blockIdx === song.text.length - 1 ? '' : null,
          onclick: () => { song.text.splice(blockIdx + 1, 0, song.text.splice(blockIdx, 1)[0]); saveState(); },
        }, '↓'),
        el('button', {
          title: 'Block vor der Cursorzeile teilen — die Takte des Abschnitts wandern anteilig mit',
          // mousedown + preventDefault: Cursorposition in der Textarea erhalten
          onmousedown: (e) => {
            e.preventDefault();
            block.zeilen = zeilenAusText(textarea.value);
            const zeile = textarea.value.slice(0, textarea.selectionStart).split('\n').length - 1;
            if (C.splitTextBlock(song, blockIdx, zeile)) saveState();
          },
        }, '✂ ab Cursor teilen'),
        el('button', { onclick: () => { song.text.splice(blockIdx, 1); saveState(); } }, 'löschen')
      ),
      textarea
    );
  }

  function renderHeadEdit(song) {
    const feld = (label, value, onchange, cls) =>
      el('div', { class: cls || '' },
        el('label', {}, label),
        el('input', { value: value == null ? '' : String(value), spellcheck: 'false', onchange }));
    return el('div', { class: 'head-edit' },
      feld('Titel', song.titel, (e) => { song.titel = e.target.value.trim() || song.titel; saveState(); }, 'feld-titel'),
      feld('Künstler', song.kuenstler, (e) => { song.kuenstler = e.target.value.trim(); saveState(); }),
      feld('Tonart', C.displayChord(song.originalTonart || 'C', state.einstellungen.notation), (e) => {
        const norm = C.normalizeInputChord(e.target.value.trim(), state.einstellungen.notation);
        if (C.parseChord(norm)) { song.originalTonart = norm; saveState(); } else render();
      }),
      feld('Taktart', song.taktart || '4/4', (e) => { song.taktart = e.target.value.trim() || '4/4'; saveState(); }),
      feld('Tempo', song.tempo, (e) => {
        const n = parseInt(e.target.value, 10);
        song.tempo = Number.isFinite(n) ? n : null;
        saveState();
      }),
      feld('Notizen', song.notizen, (e) => { song.notizen = e.target.value.trim(); saveState(); }, 'feld-notizen')
    );
  }

  function renderTransposeCtl(song) {
    const off = ((song.transposeOffset || 0) % 12 + 12) % 12;
    const setOffset = (n) => { song.transposeOffset = ((n % 12) + 12) % 12; saveState(); };
    return el('span', { class: 'transpose-ctl' },
      el('button', { title: 'Halbton runter', onclick: () => setOffset(off - 1) }, '−'),
      el('span', { class: 't-key' }, keyForDisplay(song)),
      el('button', { title: 'Halbton hoch', onclick: () => setOffset(off + 1) }, '+'),
      el('select', {
        title: 'Zieltonart wählen',
        onchange: (e) => setOffset(parseInt(e.target.value, 10)),
      }, Array.from({ length: 12 }, (_, i) =>
        el('option', { value: String(i), selected: i === off ? '' : null },
          C.displayChord(C.transposeKey(song.originalTonart || 'C', i), state.einstellungen.notation) +
          (i === 0 ? ' (Original)' : '')))),
      off !== 0 ? el('span', { class: 't-orig' },
        'orig. ' + C.displayChord(song.originalTonart || 'C', state.einstellungen.notation)) : null
    );
  }

  // ---------- Setlisten ----------

  function setlistById(id) {
    return state.setlisten.find(s => s.id === id) || null;
  }

  function songById(id) {
    return state.songs.find(s => s.id === id) || null;
  }

  // Effektiver Song für Setlist-Kontext: Override ersetzt den Song-Offset.
  // Flache Kopie — alle Renderfunktionen arbeiten unverändert damit.
  function songMitOverride(eintrag) {
    const song = songById(eintrag.songId);
    if (!song) return null;
    if (eintrag.offsetOverride == null) return song;
    return Object.assign({}, song, { transposeOffset: eintrag.offsetOverride });
  }

  function renderSetlists(view) {
    let nameFeld;
    view.append(
      el('div', { class: 'song-toolbar' },
        el('span', { style: 'display:inline-flex; gap:0.4rem; align-items:center' },
          nameFeld = el('input', {
            class: 'lib-suche', style: 'margin:0; max-width:18rem', type: 'text',
            placeholder: 'Neue Setliste (Name)…',
            onkeydown: (e) => { if (e.key === 'Enter') neueSetliste(); },
          }),
          el('button', { class: 'primaer', onclick: () => neueSetliste() }, '+ Anlegen'))
      )
    );
    function neueSetliste() {
      const name = nameFeld.value.trim();
      if (!name) return;
      const sl = { id: 'sl-' + Date.now().toString(36), name, datum: '', eintraege: [] };
      state.setlisten.push(sl);
      ui.setlistId = sl.id; ui.view = 'setlist';
      saveState();
    }

    if (state.setlisten.length === 0) {
      view.append(el('div', { class: 'sl-leer' },
        'Noch keine Setlisten. Eine Setliste ist die Song-Reihenfolge für einen Gig — druckbar und für den Bühnenmodus.'));
      return;
    }
    view.append(el('div', {}, state.setlisten.map(sl =>
      el('div', {
        class: 'lib-item', role: 'button', tabindex: '0',
        onclick: () => { ui.view = 'setlist'; ui.setlistId = sl.id; render(); },
        onkeydown: (e) => { if (e.key === 'Enter') { ui.view = 'setlist'; ui.setlistId = sl.id; render(); } },
      },
        el('span', { class: 't' }, sl.name),
        el('span', { class: 'a' }, (sl.datum ? sl.datum + ' · ' : '') + sl.eintraege.length + ' Songs'),
        ui.slLoeschen === sl.id
          ? el('button', {
              class: 'loeschen bestaetigen',
              onclick: (e) => {
                e.stopPropagation();
                state.setlisten = state.setlisten.filter(x => x.id !== sl.id);
                ui.slLoeschen = null;
                saveState();
              },
            }, 'wirklich löschen?')
          : el('button', {
              class: 'loeschen', title: 'Setliste löschen',
              onclick: (e) => { e.stopPropagation(); ui.slLoeschen = sl.id; render(); },
            }, '✕')
      ))));
  }

  function renderSetlistEintrag(sl, eintrag, idx) {
    const song = songById(eintrag.songId);
    const zeile = el('div', {
      class: 'sl-eintrag',
      draggable: SHARE ? null : 'true',
      ondragstart: (e) => { ui.dragIdx = idx; e.dataTransfer.effectAllowed = 'move'; },
      ondragover: (e) => { e.preventDefault(); zeile.classList.add('drag-ueber'); },
      ondragleave: () => zeile.classList.remove('drag-ueber'),
      ondrop: (e) => {
        e.preventDefault();
        if (ui.dragIdx == null || ui.dragIdx === idx) return;
        const [bewegt] = sl.eintraege.splice(ui.dragIdx, 1);
        sl.eintraege.splice(idx, 0, bewegt);
        ui.dragIdx = null;
        saveState();
      },
    },
      el('span', { class: 'griff', title: 'Ziehen zum Umsortieren' }, '≡'),
      el('span', { class: 'nr' }, String(idx + 1) + '.')
    );

    if (!song) {
      zeile.append(el('span', { class: 'kuenstler' }, '(Song gelöscht)'),
        el('span', { class: 'spacer' }),
        el('button', { onclick: () => { sl.eintraege.splice(idx, 1); saveState(); } }, 'entfernen'));
      return zeile;
    }

    const eff = songMitOverride(eintrag);
    zeile.append(
      el('button', {
        class: 'titel-link',
        onclick: () => { ui.view = 'song'; ui.songId = song.id; render(); },
      }, song.titel),
      el('span', { class: 'kuenstler' }, song.kuenstler || ''),
      el('span', { class: 'spacer' }),
      el('span', { class: 'transpose-ctl', style: 'margin-left:0' },
        el('button', {
          title: 'Halbton runter (nur in dieser Setliste)',
          onclick: () => {
            const basis = eintrag.offsetOverride != null ? eintrag.offsetOverride : (song.transposeOffset || 0);
            eintrag.offsetOverride = ((basis - 1) % 12 + 12) % 12;
            saveState();
          },
        }, '−'),
        el('span', { class: 't-key' }, keyForDisplay(eff)),
        el('button', {
          title: 'Halbton hoch (nur in dieser Setliste)',
          onclick: () => {
            const basis = eintrag.offsetOverride != null ? eintrag.offsetOverride : (song.transposeOffset || 0);
            eintrag.offsetOverride = ((basis + 1) % 12 + 12) % 12;
            saveState();
          },
        }, '+'),
        eintrag.offsetOverride != null
          ? el('button', {
              title: 'Override entfernen — Tonart wie im Song',
              onclick: () => { delete eintrag.offsetOverride; saveState(); },
            }, '= Song')
          : el('span', { class: 'override-hinweis' }, 'wie Song')
      ),
      el('span', { class: 'sec-ops' },
        el('button', {
          disabled: idx === 0 ? '' : null,
          onclick: () => { sl.eintraege.splice(idx - 1, 0, sl.eintraege.splice(idx, 1)[0]); saveState(); },
        }, '↑'),
        el('button', {
          disabled: idx === sl.eintraege.length - 1 ? '' : null,
          onclick: () => { sl.eintraege.splice(idx + 1, 0, sl.eintraege.splice(idx, 1)[0]); saveState(); },
        }, '↓'),
        el('button', { onclick: () => { sl.eintraege.splice(idx, 1); saveState(); } }, 'entfernen')
      )
    );
    return zeile;
  }

  function renderTeilenPanel(sl) {
    const status = el('span', { class: 'import-hinweis' });
    const feld = el('input', { type: 'text', readonly: '', value: sl.share ? teilenLink(sl) : '' });
    const hochladen = (erzwingen) => {
      status.textContent = 'Wird verschlüsselt und hochgeladen…';
      teileSetliste(sl, erzwingen).then((r) => {
        feld.value = teilenLink(sl);
        feld.style.display = '';
        status.textContent = r === 'unveraendert' ? 'Online-Stand ist aktuell.'
          : 'Hochgeladen - in 1-2 Minuten unter dem Link erreichbar.';
      }).catch((e) => { status.textContent = e.message; });
    };
    if (!sl.share) feld.style.display = 'none';
    return el('div', { class: 'ireal-export teilen-panel' },
      el('div', { class: 'import-hinweis' },
        'Nur-Lese-Link für die Band: ansehen und selbst transponieren, nichts ändern. ' +
        'Inhalt liegt verschlüsselt auf stotco.de, der Schlüssel steckt nur im Link - wer den Link hat, kann lesen. ' +
        'Änderungen an Songs der Setliste werden automatisch nachgeladen, solange stotco sheets hier offen ist.'),
      el('div', { class: 'song-toolbar' },
        el('button', { class: 'primaer', onclick: () => hochladen(false) }, sl.share ? 'Jetzt aktualisieren' : 'Link erzeugen'),
        sl.share ? el('button', {
          onclick: () => {
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(teilenLink(sl)).then(() => { status.textContent = 'Link kopiert.'; });
            } else { feld.select(); status.textContent = 'Link markiert - bitte selbst kopieren.'; }
          },
        }, 'Link kopieren') : null,
        status),
      feld);
  }

  // iReal-Link der Setliste — jeder Song in seiner Setlisten-Tonart
  // (songMitOverride setzt den Override als transposeOffset).
  function irealExportLink(sl, songs) {
    return C.irealPlaylistLink(songs.map(s => C.stotcoSongZuIreal(s)), sl.name + (sl.datum ? ' ' + sl.datum : ''));
  }

  function htmlEscape(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function renderSetlist(view, sl) {
    view.append(
      el('div', { class: 'song-toolbar' },
        SHARE ? null : el('button', {
          class: 'zurueck', style: 'margin-bottom:0',
          onclick: () => { ui.view = 'library'; ui.bibTab = 'setlisten'; ui.setlistId = null; render(); },
        }, '← Setlisten'),
        SHARE ? null : el('button', {
          class: ui.teilen ? 'primaer' : '',
          title: 'Nur-Lese-Link für die Band (verschlüsselt auf stotco.de)',
          onclick: () => { ui.teilen = !ui.teilen; render(); },
        }, 'Teilen'),
        sl.eintraege.length ? el('button', {
          class: 'primaer',
          onclick: () => { enterStageSetlist(sl, 0); },
        }, '▶ Bühne') : null,
        sl.eintraege.length ? el('button', {
          onclick: () => { ui.view = 'setlistprint'; render(); },
        }, 'Komplett drucken') : null,
        sl.eintraege.length ? el('button', {
          onclick: () => { ui.irealExport = !ui.irealExport; render(); },
        }, '→ iReal Pro') : null
      ),
      SHARE && ui.teilenStand ? el('div', { class: 'import-hinweis' },
        'Stand: ' + new Date(ui.teilenStand).toLocaleString('de-DE', { dateStyle: 'short', timeStyle: 'short' }) +
        ' - Tonart pro Song mit − / + selbst einstellen (bleibt auf diesem Gerät).') : null,
      !SHARE && ui.teilen ? renderTeilenPanel(sl) : null,
      ui.irealExport && sl.eintraege.length ? (() => {
        // Gelöschte Songs fallen raus (songMitOverride liefert null)
        const songs = sl.eintraege.map(songMitOverride).filter(Boolean);
        if (!songs.length) {
          return el('div', { class: 'ireal-export' },
            el('div', { class: 'import-hinweis' }, 'Keine Songs zum Exportieren — die Einträge dieser Setliste sind gelöscht.'));
        }
        const link = irealExportLink(sl, songs);
        const status = el('span', { class: 'import-hinweis' });
        // Fallback ohne Zwischenablage (http über Tailscale = kein Secure Context)
        const feld = el('textarea', { readonly: '', rows: '3', style: 'display:none;width:100%;margin-top:0.4rem;font:0.8rem monospace' });
        const zeigeFeld = () => {
          feld.value = link;
          feld.style.display = '';
          feld.focus();
          feld.select();
          feld.setSelectionRange(0, link.length);
          status.textContent = 'Kopieren hier nicht möglich — Link ist unten markiert, bitte selbst kopieren.';
        };
        // UG-Import legt "Capo N." nur in den Notizen ab: Akkorde sind dann Griffbilder
        const capo = songs.filter(x => /\bCapo \d/i.test(x.notizen || '')).map(x => x.titel);
        return el('div', { class: 'ireal-export' },
          el('div', { class: 'import-hinweis' },
            songs.length + ' Songs in Setlisten-Tonart. Bläser stellen in iReal ihr Instrument ein ' +
            '(B/Es) — iReal transponiert selbst.'),
          capo.length ? el('div', { class: 'import-hinweis ireal-capo' },
            el('span', { class: 'badge-warn' }, 'Capo-Songs:'),
            ' Akkorde sind Griffbilder, nicht klingend — vor dem Export Tonart prüfen: ' + capo.join(', ')) : null,
          el('div', { class: 'song-toolbar' },
            el('a', { href: link }, 'In iReal Pro öffnen'),
            el('button', {
              onclick: () => {
                if (!(navigator.clipboard && navigator.clipboard.writeText)) { zeigeFeld(); return; }
                navigator.clipboard.writeText(link)
                  .then(() => { status.textContent = 'Link kopiert.'; })
                  .catch(zeigeFeld);
              },
            }, 'Link kopieren'),
            el('button', {
              class: 'primaer',
              onclick: () => {
                const titel = htmlEscape(sl.name);
                const html = '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width">' +
                  '<title>' + titel + '</title><body style="font:1.2rem system-ui;padding:2rem">' +
                  '<p><a href="' + link + '">' + titel + ' in iReal Pro öffnen</a></p>' +
                  '<p style="color:#666">Auf dem iPad/iPhone mit installiertem iReal Pro antippen.</p></body>';
                const href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
                const a = document.createElement('a');
                a.href = href;
                a.download = (sl.name || 'setliste').replace(/[^\wäöüÄÖÜß.-]+/g, '-') + '-ireal.html';
                a.click();
                // Safari/iPadOS bricht den Download ab, wenn die URL sofort widerrufen wird
                setTimeout(() => URL.revokeObjectURL(href), 30000);
              },
            }, 'Als Datei speichern'),
            status),
          feld);
      })() : null,
      el('div', { class: 'sl-kopf' },
        el('input', {
          type: 'text', value: sl.name, spellcheck: 'false',
          onchange: (e) => { sl.name = e.target.value.trim() || sl.name; saveState(); },
        }),
        el('input', {
          type: 'date', value: sl.datum || '',
          onchange: (e) => { sl.datum = e.target.value; saveState(); },
        })
      )
    );

    if (sl.eintraege.length === 0) {
      view.append(el('div', { class: 'sl-leer' }, 'Noch keine Songs — unten aus der Bibliothek hinzufügen.'));
    } else {
      view.append(el('div', {}, sl.eintraege.map((eintrag, idx) => renderSetlistEintrag(sl, eintrag, idx))));
    }

    const verfuegbar = state.songs.filter(s => !sl.eintraege.some(e => e.songId === s.id));
    if (verfuegbar.length) {
      let picker;
      view.append(el('div', { class: 'sl-hinzu' },
        picker = el('select', {}, verfuegbar.map(s =>
          el('option', { value: s.id }, s.titel + (s.kuenstler ? ' — ' + s.kuenstler : '')))),
        el('button', {
          class: 'primaer',
          onclick: () => { sl.eintraege.push({ songId: picker.value }); saveState(); },
        }, '+ zur Setliste')
      ));
    }
  }

  // ---------- Zwei-Spalten-Körper mit ziehbarer Trennlinie ----------

  function renderSheetBody(song, lyricsCol, gridCol) {
    const body = el('div', {
      class: 'sheet-body',
      style: '--split:' + (song.split || 55),
    });
    const divider = el('div', {
      class: 'split-divider',
      title: 'Spaltenbreite ziehen · Doppelklick setzt zurück',
      onpointerdown: (e) => {
        e.preventDefault();
        divider.setPointerCapture(e.pointerId);
        divider.classList.add('zieht');
        const rect = body.getBoundingClientRect();
        const move = (ev) => {
          const pct = Math.min(75, Math.max(25, ((ev.clientX - rect.left) / rect.width) * 100));
          body.style.setProperty('--split', pct.toFixed(1));
        };
        const up = (ev) => {
          divider.classList.remove('zieht');
          divider.removeEventListener('pointermove', move);
          divider.removeEventListener('pointerup', up);
          const pct = parseFloat(body.style.getPropertyValue('--split'));
          if (Number.isFinite(pct)) { song.split = Math.round(pct); saveState(); }
        };
        divider.addEventListener('pointermove', move);
        divider.addEventListener('pointerup', up);
      },
      ondblclick: () => { delete song.split; saveState(); },
    });
    body.append(lyricsCol, divider, gridCol);
    return body;
  }

  // ---------- Bühnenmodus ----------

  let wakeLock = null;
  async function wakeLockAn() {
    try {
      if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
    } catch (e) { console.warn('Wake Lock nicht verfügbar:', e); }
  }
  function wakeLockAus() {
    if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', () => {
    if (ui.view === 'stage' && document.visibilityState === 'visible') wakeLockAn();
  });

  function enterStage(song) {
    ui.view = 'stage';
    ui.songId = song.id;
    ui.stageCtx = null;
    ui.edit = false; ui.barSel = null;
    wakeLockAn();
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    render();
  }

  function enterStageSetlist(sl, pos) {
    ui.view = 'stage';
    ui.stageCtx = { setlistId: sl.id, pos };
    ui.edit = false; ui.barSel = null;
    wakeLockAn();
    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }
    render();
  }

  function exitStage() {
    ui.view = ui.stageCtx ? 'setlist' : 'song';
    ui.stageCtx = null;
    wakeLockAus();
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    render();
  }

  // Vollbild per Esc/System verlassen beendet auch den Bühnenmodus
  document.addEventListener('fullscreenchange', () => {
    if (!document.fullscreenElement && ui.view === 'stage') exitStage();
  });

  // Blättern: erst innerhalb des Songs (bildschirmweise), an den Rändern
  // weiter zum nächsten/vorigen Song der Setliste.
  function stageBlaettern(richtung) {
    const amEnde = window.scrollY + window.innerHeight >= document.body.scrollHeight - 20;
    const amAnfang = window.scrollY <= 10;
    if (ui.stageCtx) {
      const sl = setlistById(ui.stageCtx.setlistId);
      if (sl) {
        if (richtung > 0 && amEnde && ui.stageCtx.pos < sl.eintraege.length - 1) {
          ui.stageCtx.pos += 1;
          render();
          window.scrollTo(0, 0);
          return;
        }
        if (richtung < 0 && amAnfang && ui.stageCtx.pos > 0) {
          ui.stageCtx.pos -= 1;
          render();
          window.scrollTo(0, 0);
          return;
        }
      }
    }
    const schritt = (window.innerHeight - 60) * richtung;
    window.scrollBy({ top: schritt, behavior: 'smooth' });
  }

  function renderStage(view, song) {
    const zoom = state.einstellungen.stageZoom || 1.25;
    document.documentElement.style.setProperty('--stage-zoom', zoom);

    const setZoom = (z) => {
      state.einstellungen.stageZoom = Math.min(2.2, Math.max(0.7, Math.round(z * 20) / 20));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
    };

    const sl = ui.stageCtx ? setlistById(ui.stageCtx.setlistId) : null;
    const ansicht = state.einstellungen.stageAnsicht || 'beide';
    const ANSICHTEN = { beide: 'Text + Akkorde', text: 'nur Text', raster: 'nur Akkorde' };
    view.append(
      el('div', { class: 'stage-bar' },
        el('button', { onclick: exitStage, title: 'Bühnenmodus beenden' }, '✕'),
        el('span', { class: 'titel-klein' },
          song.titel + '  ·  ' + keyForDisplay(song) +
          (song.tempo ? '  ·  ' + song.tempo + ' bpm' : '')),
        el('span', { class: 'spacer' }),
        sl ? el('span', { class: 'titel-klein', style: 'font-weight:400' },
          (ui.stageCtx.pos + 1) + ' / ' + sl.eintraege.length) : null,
        el('button', {
          title: 'Ansicht wechseln: beide Spalten / nur Text / nur Akkorde',
          onclick: () => {
            const reihe = ['beide', 'text', 'raster'];
            state.einstellungen.stageAnsicht = reihe[(reihe.indexOf(ansicht) + 1) % reihe.length];
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            render();
          },
        }, ANSICHTEN[ansicht]),
        el('button', { onclick: () => setZoom(zoom - 0.1), title: 'kleiner' }, 'A−'),
        el('button', { onclick: () => setZoom(zoom + 0.1), title: 'größer' }, 'A+')
      ),
      el('div', { class: 'tap-zone links', onclick: () => stageBlaettern(-1) }),
      el('div', { class: 'tap-zone rechts', onclick: () => stageBlaettern(1) })
    );

    const inhalt = el('div', { class: 'stage-inhalt' });
    const lyricsCol = el('div', { class: 'lyrics-col' },
      song.text.map((block, i) => renderTextBlock(song, block, i)));
    const gridCol = el('div', { class: 'grid-col' },
      song.abschnitte.map((abschnitt, i) => renderGridSection(song, abschnitt, i)));
    if (ansicht === 'text') {
      inhalt.append(el('div', { class: 'sheet-body einspaltig' }, lyricsCol));
    } else if (ansicht === 'raster') {
      inhalt.append(el('div', { class: 'sheet-body einspaltig' }, gridCol));
    } else {
      inhalt.append(renderSheetBody(song, lyricsCol, gridCol));
    }
    view.append(inhalt);
  }

  function renderImportVorschau(container, raw, zeilenTakte) {
    container.replaceChildren();
    if (!raw.trim()) {
      container.append(el('div', { class: 'v-leer' }, 'Die Vorschau erscheint beim Einfügen.'));
      return;
    }
    const r = C.parseUGText(raw, { zeilenTakte });
    container.append(
      el('div', { class: 'v-titel' }, r.titel + (r.kuenstler ? ' — ' + r.kuenstler : '')),
      el('div', { class: 'v-meta' },
        'Tonart ' + C.displayChord(r.originalTonart, state.einstellungen.notation) +
        (r.capo ? ' · Capo ' + r.capo : '') +
        (r.warnungen.length ? ' · ⚠ ' + r.warnungen.join('. ') : ''))
    );
    const pseudoSong = { transposeOffset: 0, originalTonart: r.originalTonart };
    for (const abschnitt of r.abschnitte) {
      container.append(
        el('div', { class: 'grid-sec', style: '--sec:' + sectionColor(abschnitt.name) },
          el('div', { class: 'grid-head' },
            el('span', { class: 'sec-mark', style: '--sec:' + sectionColor(abschnitt.name) }, anzeigeName(abschnitt.name))),
          renderBars(pseudoSong, abschnitt, -1, { kompakt: false })
        ));
    }
  }

  function ugSuche(query) {
    const q = (query || '').trim();
    if (!q) return;
    window.open('https://www.ultimate-guitar.com/search.php?search_type=title&value=' +
      encodeURIComponent(q), '_blank');
  }

  function renderEinstellungen(view) {
    const e = state.einstellungen;

                  transposeOffset: 0,
                  abschnitte: r.abschnitte.length ? r.abschnitte : [{ name: 'Strophe', takte: [[], [], [], []] }],
                  text: r.text.length ? r.text : [{ ref: 'Strophe', zeilen: [] }],
                  notizen: (r.capo ? 'Capo ' + r.capo + '. ' : '') + r.warnungen.join('. '),

  // iReal-Import: Link oder HTML-Export einfügen bzw. Datei wählen, Songs
  // auswählen, übernehmen. Große Forums-Playlists: nichts vorausgewählt,
  // Suche zum Eingrenzen, höchstens 200 Zeilen gleichzeitig.
  function renderIrealImport(view) {
    let feld, filter, liste;
    let funde = [];

    const auswerten = () => {
      funde = [];
      for (const link of C.irealLinksFinden(feld.value)) {
        for (const rec of C.irealLinkLesen(link).songs) {
          const r = C.irealSongZuStotco(rec);
          funde.push({ song: r.song, warnungen: r.warnungen, dublette: C.irealDublette(state.songs, rec.titel), gewaehlt: false });
        }
      }
      if (funde.length <= 20) funde.forEach(f => { f.gewaehlt = !f.dublette; });
      zeichne();
    };

    const zeichne = () => {
      const q = filter.value.trim().toLowerCase();
      const sichtbar = funde.filter(f => !q ||
        f.song.titel.toLowerCase().includes(q) || f.song.kuenstler.toLowerCase().includes(q));
      const gewaehlt = funde.filter(f => f.gewaehlt).length;
      liste.replaceChildren(el('div', {},
        el('div', { class: 'import-hinweis' }, funde.length
          ? funde.length + ' Songs gefunden, ' + gewaehlt + ' ausgewählt'
          : 'Noch kein iReal-Link erkannt.'),
        sichtbar.slice(0, 200).map(f => el('label', { class: 'ireal-fund' },
          el('input', {
            type: 'checkbox', checked: f.gewaehlt ? '' : null,
            onchange: (e) => { f.gewaehlt = e.target.checked; zeichne(); },
          }),
          el('span', {}, f.song.titel + (f.song.kuenstler ? ' — ' + f.song.kuenstler : '') + ' · ' + f.song.originalTonart),
          f.dublette ? el('span', { class: 'badge-warn' }, 'schon in der Bibliothek') : null,
          f.warnungen.length ? el('span', { class: 'badge-warn', title: f.warnungen.join('\n') }, 'Form prüfen') : null
        )),
        sichtbar.length > 200
          ? el('div', { class: 'import-hinweis' }, '… ' + (sichtbar.length - 200) + ' weitere — Suche eingrenzen')
          : null,
        gewaehlt ? el('div', { class: 'song-toolbar' },
          el('button', {
            class: 'primaer',
            onclick: () => {
              const basis = Date.now().toString(36);
              funde.filter(f => f.gewaehlt).forEach((f, i) => {
                state.songs.push(Object.assign({ id: 'song-' + basis + '-' + i }, f.song));
              });
              ui.view = 'library';
              saveState();
            },
          }, gewaehlt + ' Songs übernehmen')) : null
      ));
    };

    view.append(
      el('button', {
        class: 'zurueck',
        onclick: () => { ui.view = 'library'; render(); },
      }, '← Bibliothek'),
      el('div', { class: 'import-hinweis' },
        'iReal-Pro-Link einfügen (in iReal: Teilen → Link kopieren) oder eine HTML-Datei aus iReal ' +
        'bzw. dem iReal-Forum wählen. Wiederholungen, Volten und D.S./Coda werden ausgeschrieben; ' +
        'Songs mit „Form prüfen" bitte im Editor gegenlesen.'),
      el('div', { class: 'song-toolbar', style: 'margin-top:0.6rem' },
        el('input', {
          type: 'file', accept: '.html,.htm,.txt',
          onchange: (e) => {
            const datei = e.target.files[0];
            if (!datei) return;
            datei.text().then(t => { feld.value = t; auswerten(); });
          },
        })
      ),
      feld = el('textarea', { class: 'import-feld', spellcheck: 'false', placeholder: 'irealb://…', oninput: auswerten }),
      filter = el('input', { class: 'ug-suche', type: 'search', placeholder: 'In den Funden suchen…', oninput: () => zeichne() }),
      liste = el('div', {})
    );
    zeichne();
    feld.focus();
  }

  // ---------- UG-PDF pro Song ----------

  // Lädt eine PDF-Datei als pdf/<songId>.pdf auf den Server; setzt song.pdf nur bei Erfolg.
  async function ladePdfHoch(song, datei) {
    const fehler = C.pdfDateiOk(datei);
    if (fehler) {
      ui.pdfStatus = { songId: song.id, text: fehler };
      render();
      return false;
    }
    ui.pdfStatus = { songId: song.id, text: 'PDF wird hochgeladen…' };
    render();
    let res;
    try {
      res = await fetch(C.pdfPfad(song.id), { method: 'PUT', body: datei });
    } catch (e) {
      ui.pdfStatus = { songId: song.id, text: 'Upload fehlgeschlagen (Server nicht erreichbar)' };
      render();
      return false;
    }
    if (!res.ok) {
      ui.pdfStatus = { songId: song.id, text: 'Upload fehlgeschlagen (' + res.status + ')' };
      render();
      return false;
    }
    song.pdf = C.pdfPfad(song.id);
    ui.pdfStatus = { songId: song.id, text: 'PDF gespeichert' };
    saveState();
    return true;
  }

  function pdfDateiWaehlen(song) {
    const input = el('input', { type: 'file', accept: 'application/pdf,.pdf', style: 'display:none' });
    input.addEventListener('change', () => {
      const datei = input.files && input.files[0];
      input.remove();
      if (datei) ladePdfHoch(song, datei);
    });
    document.body.append(input);
    input.click();
  }

  function pdfKnoepfe(song) {
    const status = ui.pdfStatus && ui.pdfStatus.songId === song.id ? ui.pdfStatus.text : null;
    return [
      song.pdf
        ? el('button', { onclick: () => window.open(song.pdf + '?v=' + Date.now(), '_blank') }, 'PDF')
        : el('button', { onclick: () => pdfDateiWaehlen(song) }, 'PDF ablegen'),
      song.pdf && ui.edit
        ? el('button', { onclick: () => pdfDateiWaehlen(song) }, 'PDF ersetzen')
        : null,
      status ? el('span', { class: 'pdf-status' }, status) : null,
    ];
  }

  function pdfDropHandler(song) {
    return {
      ondragover: (e) => {
        if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
        e.preventDefault();
        e.currentTarget.classList.add('drop-aktiv');
      },
      ondragleave: (e) => { e.currentTarget.classList.remove('drop-aktiv'); },
      ondrop: (e) => {
        e.currentTarget.classList.remove('drop-aktiv');
        const datei = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (!datei) return;
        e.preventDefault();
        ladePdfHoch(song, datei);
      },
    };
  }

          onclick: () => {
            if (ui.edit) delete song.ungeprueft; // Editor verlassen = Raster gilt als geprüft
            ui.edit = !ui.edit; ui.barSel = null; ui.barErr = false;

          el('button', {

          }, 'Kompakt'),

          }, 'Ausführlich')),
        ui.edit ? null : el('button', { onclick: () => enterStage(song) }, 'Bühne'),
        renderTransposeCtl(song),
        ui.edit ? el('button', {
          class: ui.neuerAbschnitt ? 'primaer' : '',
          onclick: () => { ui.neuerAbschnitt = !ui.neuerAbschnitt; render(); },
        }, '+ Abschnitt') : null,
        ui.edit ? el('button', {

      )

    if (ui.edit && ui.neuerAbschnitt) {
      const TYPEN = ['Intro', 'Strophe', 'Vorrefrain', 'Refrain', 'Post-Chorus', 'Bridge', 'Zwischenspiel', 'Solo', 'Outro'];
      view.append(el('div', { class: 'suffix-chips', style: 'margin-bottom:1rem' },
        TYPEN.map(typ => el('button', {

            song.text.push({ ref: name, zeilen: [] });

        song.tempo ? el('span', {}, el('span', { class: 'label' }, 'Tempo'), String(song.tempo)) : null
      );
      view.append(

            el('div', { class: 'titel' }, song.titel),
            el('div', { class: 'kuenstler' }, song.kuenstler || '')

      if (song.notizen) view.append(el('div', { class: 'sheet-notizen' }, song.notizen));
    }

    const lyricsCol = el('div', { class: 'lyrics-col' },

    );

      song.abschnitte.map((abschnitt, i) => renderGridSection(song, abschnitt, i))
    );

    view.append(renderSheetBody(song, lyricsCol, gridCol));

    // Fokus in das aktive Takt-Input setzen
    if (ui.edit && ui.barSel) {

  function render() {
    const reminder = document.getElementById('export-reminder');
    if (state._aenderungenSeitExport >= EXPORT_REMINDER_THRESHOLD) {
      reminder.textContent = state._aenderungenSeitExport +
        ' Änderungen seit dem letzten Export — bitte sichern (Export-Button oben rechts).';
      reminder.classList.add('visible');
    } else {
      reminder.classList.remove('visible');
    }

    const view = document.getElementById('view');
    view.replaceChildren();

    const song = ui.songId ? state.songs.find(s => s.id === ui.songId) : null;
    let stageSong = null;
    if (ui.view === 'stage') {
      if (ui.stageCtx) {
        const sl = setlistById(ui.stageCtx.setlistId);
        const eintrag = sl && sl.eintraege[ui.stageCtx.pos];
        stageSong = eintrag ? songMitOverride(eintrag) : null;
      } else {
        stageSong = song;
      }
    }
    document.body.classList.toggle('stage-mode', !!stageSong);
    const setlist = ui.setlistId ? setlistById(ui.setlistId) : null;

    if (stageSong) {
      renderStage(view, stageSong);
    } else if (ui.view === 'setlist' && setlist) {
      renderSetlist(view, setlist);
    } else if (ui.view === 'setlistprint' && setlist) {
      renderSetlistPrint(view, setlist);
    } else if (ui.view === 'song' && song) {
      renderSong(view, song);
      if (!SHARE) history.replaceState(null, '', '#' + encodeURIComponent(song.id));
    } else if (ui.view === 'import') {
      renderImport(view);
    } else if (ui.view === 'irealimport') {
      renderIrealImport(view);
    } else if (ui.view === 'einstellungen') {
      renderEinstellungen(view);
    } else if (ui.view === 'pdfzuordnung' && ui.pdfZuordnung) {
      renderPdfZuordnung(view);
    } else if (SHARE) {
      if (setlist) { ui.view = 'setlist'; renderSetlist(view, setlist); }
    } else {
      ui.view = 'library';
      renderLibrary(view);
      history.replaceState(null, '', location.pathname);
    }
  }

  // Übergabe vom UG-Userscript: #ugimport=<base64-Text> öffnet die
  // Import-Ansicht vorbefüllt (siehe ug-import.user.js im Repo).
  function handleUgImportHash() {
    if (!location.hash.startsWith('#ugimport=')) return false;
    const r = C.parseUgImportHash(location.hash);
    if (r) {
      ui.importPrefill = r.text;
      ui.importPrefillTab = r.tabId;
      ui.view = 'import';
    } else {
      console.warn('ugimport-Hash nicht lesbar');
    }
    history.replaceState(null, '', location.pathname);
    return true;
  }

  // Übergabe eines UG-PDFs vom Userscript: #ugpdf=<tabId>|<titel>|<kuenstler>.
  // Die Datei liegt als pdf/ug-<tabId>.pdf in der Inbox auf dem Server.
  function handleUgPdfHash() {
    if (!location.hash.startsWith('#ugpdf=')) return false;
    const info = C.parseUgPdfHash(location.hash);
    history.replaceState(null, '', location.pathname);
    if (!info || !info.tabId) {
      console.warn('ugpdf-Hash nicht lesbar');
      return true;
    }
    uebernimmUgPdf(info);
    return true;
  }

  async function uebernimmUgPdf(info) {
    const inbox = 'pdf/ug-' + info.tabId + '.pdf';
    let blob;
    try {
      const res = await fetch(inbox + '?v=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      blob = await res.blob();
    } catch (e) {
      ui.pdfZuordnung = { info, blob: null, fehler: 'UG-PDF nicht gefunden (' + inbox + ')' };
      ui.view = 'pdfzuordnung';
      render();
      return;
    }
    const song = C.songFuerUgPdf(state.songs, info);
    if (song) {
      await pdfZuordnen(song, info, blob);
    } else {
      ui.pdfZuordnung = { info, blob };
      ui.view = 'pdfzuordnung';
      render();
    }
  }

  // Inbox-Blob beim Song ablegen, Inbox-Datei löschen, ugTabId merken, Song öffnen.
  async function pdfZuordnen(song, info, blob) {
    ui.pdfZuordnung = null;
    ui.view = 'song'; ui.songId = song.id; ui.edit = false; ui.barSel = null;
    const datei = new File([blob], 'ug-' + info.tabId + '.pdf', { type: 'application/pdf' });
    const ok = await ladePdfHoch(song, datei);
    if (!ok) return; // Statustext steht in der Leiste, Inbox-Datei bleibt liegen
    if (!song.ugTabId) song.ugTabId = info.tabId;
    saveState();
    try { await fetch('pdf/ug-' + info.tabId + '.pdf', { method: 'DELETE' }); } catch (e) { /* Inbox-Rest ist unkritisch */ }
  }

  function renderPdfZuordnung(view) {
    const { info, blob, fehler } = ui.pdfZuordnung;
    const abbrechen = () => { ui.pdfZuordnung = null; ui.view = 'library'; render(); };
    let suche, liste;
    const zeichne = () => {
      const q = suche.value.trim().toLowerCase();
      const treffer = state.songs.filter(s => !q ||
        String(s.titel || '').toLowerCase().includes(q) || String(s.kuenstler || '').toLowerCase().includes(q));
      // replaceChildren nimmt Einzelargumente, kein Array (sonst „[object HTMLButtonElement]“)
      liste.replaceChildren(...(
        treffer.length ? treffer.map(s => el('button', {
          class: 'ireal-fund', style: 'width:100%; text-align:left; cursor:pointer',
          onclick: () => pdfZuordnen(s, info, blob),
        }, s.titel + (s.kuenstler ? ' — ' + s.kuenstler : '') + (s.pdf ? ' (hat schon ein PDF)' : '')))
        : [el('div', { class: 'import-hinweis' }, 'Kein Song passt zur Suche.')]
      ));
    };
    view.append(
      el('div', { class: 'song-toolbar' },
        el('button', { class: 'zurueck', style: 'margin-bottom:0', onclick: abbrechen }, 'Abbrechen')
      ),
      el('h2', {}, 'UG-PDF zuordnen'),
      el('p', { class: 'import-hinweis' },
        'Von Ultimate Guitar kam ein PDF für „' + (info.titel || '?') + '“' +
        (info.kuenstler ? ' von ' + info.kuenstler : '') + ' (Tab ' + info.tabId + '). ' +
        (fehler ? fehler : 'Kein Song passt eindeutig — bitte den Song wählen, zu dem das PDF gehört.'))
    );
    if (fehler) return;
    view.append(
      suche = el('input', { class: 'ug-suche', type: 'search', placeholder: 'Song suchen…', oninput: zeichne,
        value: info.titel || '' }),
      liste = el('div', { style: 'margin-top:0.6rem' })
    );
    zeichne();
    if (!state.songs.some(s => String(s.titel || '').toLowerCase().includes(suche.value.trim().toLowerCase()))) {
      suche.value = '';
      zeichne();
    }
    suche.focus();
  }

  if (SHARE) {
    document.body.classList.add('nur-lesen');
    ladeGeteilteSetliste();
  } else {
    handleUgImportHash() || handleUgPdfHash();
  }
  // Auch ohne Reload reagieren (Tab war schon offen, Hash ändert sich nur)
  window.addEventListener('hashchange', () => {
    if (handleUgImportHash() || handleUgPdfHash()) render();
  });

  // Direktlink: #song-id öffnet den Song sofort (Bookmarks, Tablet, Druck-Automation)
  const hashId = SHARE ? '' : decodeURIComponent(location.hash.slice(1));
  if (hashId && !ui.importPrefill && state.songs.some(s => s.id === hashId)) {
    ui.view = 'song';
    ui.songId = hashId;
  }

  // Druck-Skalierung: Inhaltshöhe bei Druckbreite messen, Schrift stufenlos
  // verkleinern bis der Song auf eine A4-Seite passt; unterhalb der Mindestgröße
  // (~66 %, entspricht ca. 9 pt Fließtext) stattdessen Zweiseiten-Umbruch
  // an Abschnittsgrenzen (break-inside: avoid).
  window.addEventListener('beforeprint', () => {
    if (ui.view !== 'song') return;
    if (ui.edit) { ui.edit = false; ui.barSel = null; render(); }
    const sheet = document.querySelector('.sheet-body');
    const head = document.querySelector('.sheet-head');
    if (!sheet) return;
    const MM = 96 / 25.4; // CSS-px pro Millimeter
    const nutzHoehe = (297 - 22) * MM;
    const druckBreite = (210 - 24) * MM;
    const main = document.querySelector('main');
    const alt = { width: main.style.width, maxWidth: main.style.maxWidth, padding: main.style.padding };
    Object.assign(main.style, { width: druckBreite + 'px', maxWidth: 'none', padding: '0' });
    const inhaltHoehe = sheet.scrollHeight + (head ? head.offsetHeight : 0) + 30;
    Object.assign(main.style, alt);
    let scale = nutzHoehe / inhaltHoehe;
    if (scale >= 1) scale = 1;
    // Unter der Lesbarkeitsgrenze: nicht skalieren, sauber umbrechen lassen
    document.documentElement.style.setProperty('--pscale',
      scale < 0.66 ? '1' : scale.toFixed(3));
  });

  document.getElementById('btn-einstellungen').addEventListener('click', () => {
    ui.view = 'einstellungen';
    render();
  });
  document.getElementById('btn-export').addEventListener('click', exportJson);
  document.getElementById('btn-import').addEventListener('click', () =>
    document.getElementById('file-import').click());
  document.getElementById('file-import').addEventListener('change', (e) => {
    if (e.target.files[0]) importJson(e.target.files[0]);
    e.target.value = '';
  });

  render();
  planeTeilenAktualisieren(); // geteilte Setlisten beim Öffnen nachziehen
})();
</script>

</body>
</html>
